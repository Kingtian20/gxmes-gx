    <script>
      // Pages, (Intentional Comment)
      const homePage = document.getElementById("home-page");
      const gxmesPage = document.getElementById("gxmes-page");
      const infoPage = document.getElementById("info-page");
      const soundboardPage = document.getElementById("soundboard-page");
      const proxyPage = document.getElementById("proxy-page");
      const gxaiPage = document.getElementById("gxai-page");

      // Buttons, (Intentional Comment)
      const homeBtn = document.getElementById("homeBtn");
      const gxmesBtn = document.getElementById("gxmesBtn");
      const infoBtn = document.getElementById("infoBtn");
      const soundboardBtn = document.getElementById("soundboardBtn");
      const proxyBtn = document.getElementById("proxyBtn");
      const gxaiBtn = document.getElementById("gxaiBtn");
      const buttons = [homeBtn, gxmesBtn, infoBtn, soundboardBtn, proxyBtn, gxaiBtn];

      // Complex Bar Canvas Anim
      const actionBarCanvas = document.getElementById("action-bar-canvas");
      const actionCtx = actionBarCanvas.getContext("2d");
      const toggleBtn = document.getElementById("toggleBtn");
      const towerPod = document.getElementById("towerPod");
      const barPod = document.getElementById("barPod");
      const menuItems = document.querySelector(".menu-items");

      let barRotation = 0;

      function resizeActionBarCanvas() {
        actionBarCanvas.width = window.innerWidth;
        actionBarCanvas.height = window.innerHeight;
      }

      function renderActionBar() {
        if (!actionBarCanvas.width || !actionBarCanvas.height) {
          console.log("Canvas not sized yet");
          requestAnimationFrame(renderActionBar);
          return;
        }
        
        actionCtx.clearRect(0, 0, actionBarCanvas.width, actionBarCanvas.height);
        barRotation += 0.04;

        const b = barPod.getBoundingClientRect();
        const t = towerPod.getBoundingClientRect();

        const m = menuItems.getBoundingClientRect();
        const isExpanded = towerPod.classList.contains("expanded");
        const towerRight = isExpanded ? Math.max(t.right, m.right) : t.right;
        const towerWidth = isExpanded ? (towerRight - t.left) : t.width;

        actionCtx.fillStyle = "black";
        actionCtx.beginPath();
        actionCtx.roundRect(b.left, b.top, b.width, b.height, b.height / 2);
        actionCtx.fill();

        actionCtx.beginPath();
        const isCircle = Math.abs(towerWidth - t.height) < 5;
        const towerRadius = isCircle ? t.height / 2 : 100;
        actionCtx.roundRect(t.left, t.top, towerWidth, t.height, towerRadius);
        actionCtx.fill();

        const centerX = (b.left + t.right) / 2;
        const centerY = (b.top + t.bottom) / 2;
        const grad = actionCtx.createConicGradient(barRotation, centerX, centerY);
        grad.addColorStop(0, "transparent");
        grad.addColorStop(0.1, "#0000ff");
        grad.addColorStop(0.2, "#00fff7");
        grad.addColorStop(0.3, "transparent");

        actionCtx.strokeStyle = grad;
        actionCtx.lineWidth = 3;
        actionCtx.shadowBlur = 2;
        actionCtx.shadowColor = "rgba(0, 0, 255, 0.8)";
        actionCtx.beginPath();
        actionCtx.roundRect(b.left, b.top, b.width, b.height, b.height / 2);
        actionCtx.stroke();
        actionCtx.beginPath();
        actionCtx.roundRect(t.left, t.top, towerWidth, t.height, towerRadius);
        actionCtx.stroke();

        requestAnimationFrame(renderActionBar);
      }

      toggleBtn.addEventListener("click", () => {
        toggleBtn.classList.toggle("active");
        towerPod.classList.toggle("expanded");
      });

      window.addEventListener("resize", resizeActionBarCanvas);
      resizeActionBarCanvas();
      
      setTimeout(() => {
        resizeActionBarCanvas();
        renderActionBar();
      }, 100);

      const mainTitle = document.querySelector(".main-title");
      const subTitle = document.querySelector(".sub-title");

      let currentPage = "home";

      const pageMap = {
        home: {page: homePage, btn: homeBtn},
        gxmes: {page: gxmesPage, btn: gxmesBtn},
        info: {page: infoPage, btn: infoBtn},
        soundboard: {page: soundboardPage, btn: soundboardBtn},
        proxy: {page: proxyPage, btn: proxyBtn},
        gxai: {page: gxaiPage, btn: gxaiBtn},
      };

      function updateButtons() {
        Object.keys(pageMap).forEach((pageName) => {
          const btn = pageMap[pageName].btn;
          if (pageName === currentPage) {
            btn.disabled = true;
            btn.style.cursor = "pointer";
            btn.style.pointerEvents = "none";
            btn.style.color = "var(--primary-color)";
            btn.style.transform = "translateY(-5px) scale(1.2)";
            btn.style.filter = "drop-shadow(0 0 10px var(--primary-color))";
          } else {
            btn.disabled = false;
            btn.style.cursor = "";
            btn.style.pointerEvents = "";
            btn.style.color = "";
            btn.style.transform = "";
            btn.style.filter = "";
          }
        });
      }

      function switchPage(targetPage) {
        if (targetPage === currentPage) return;

        const prevPage = pageMap[currentPage].page;
        const nextPage = pageMap[targetPage].page;
        const canvas = document.getElementById("home-canvas");

        prevPage.style.display = "none";
        nextPage.style.display = "flex";
        nextPage.classList.remove("page-fade");
        void nextPage.offsetWidth;
        nextPage.classList.add("page-fade");

        if (targetPage === "home") {
          canvas.classList.remove("hidden");
        } else {
          canvas.classList.add("hidden");
        }

        currentPage = targetPage;
        updateButtons();

        if (targetPage === "home") {
          if (mainTitle) {
            mainTitle.style.animation = "none";
            void mainTitle.offsetWidth;
            mainTitle.style.animation = "glitch 2s infinite";
          }
          if (subTitle) {
            subTitle.style.animation = "none";
            void subTitle.offsetWidth;
            subTitle.style.animation = "glitch 2s infinite";
          }
        } else if (targetPage === "gxmes") {
          gameSearch.focus();
        } else if (targetPage === "info") {
        } else if (targetPage === "soundboard") {
        } else if (targetPage === "proxy") {
        } else if (targetPage === "gxai") {
        }
      }

      function showDelayedTooltip(btn) {
        btn.classList.add("show-tooltip");
        setTimeout(() => {
          btn.classList.remove("show-tooltip");
        }, 300);
      }

      homeBtn.addEventListener("click", () => {
        showDelayedTooltip(homeBtn);
        switchPage("home");
      });
      gxmesBtn.addEventListener("click", () => {
        showDelayedTooltip(gxmesBtn);
        switchPage("gxmes");
      });
      infoBtn.addEventListener("click", () => {
        showDelayedTooltip(infoBtn);
        switchPage("info");
      });
      soundboardBtn.addEventListener("click", () => {
        showDelayedTooltip(soundboardBtn);
        switchPage("soundboard");
      });
      proxyBtn.addEventListener("click", () => {
        showDelayedTooltip(proxyBtn);
        switchPage("proxy");
      });
      gxaiBtn.addEventListener("click", () => {
        showDelayedTooltip(gxaiBtn);
        switchPage("gxai");
      });

      const settingsBtn = document.getElementById("settingsBtn");
      const settingsModal = document.getElementById("settings-modal");
      const settingsClose = document.getElementById("settingsClose");
      const settingsUuid = document.getElementById("settings-uuid");

      let userUUID = localStorage.getItem("userUUID");
      if (!userUUID) {
        userUUID = crypto.randomUUID();
        localStorage.setItem("userUUID", userUUID);
      }
      settingsUuid.textContent = userUUID;

      settingsBtn.addEventListener("click", () => {
        settingsModal.classList.add("active");
      });

      settingsClose.addEventListener("click", () => {
        settingsModal.classList.remove("active");
      });

      settingsModal.addEventListener("click", (e) => {
        if (e.target === settingsModal) {
          settingsModal.classList.remove("active");
        }
      });

      const copyUuidBtn = document.getElementById("copyUuidBtn");
      copyUuidBtn.addEventListener("click", async () => {
        try {

    <script>
      const canvas = document.getElementById("home-canvas");
      const ctx = canvas.getContext("2d");

      let stars = [];
      let constellations = [];
      let shootingStars = [];
      let lastSpawn = Date.now();

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        createStars();
        createConstellations();
      }

      function createStars() {
        stars = Array.from({length: 200}, () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 1.5 + 0.5,
          opacity: Math.random() * 0.9,
          speed: Math.random() * 0.02 + 0.005,
          phase: Math.random() * Math.PI * 2,
        }));
      }

      function createConstellations() {
        constellations = [];

        for (let i = 0; i < 5; i++) {
          const cx = Math.random() * canvas.width;
          const cy = Math.random() * canvas.height;

          const points = [];
          const connections = [];
          const count = Math.floor(Math.random() * 4) + 4;
          const radius = Math.random() * 80 + 60;

          for (let j = 0; j < count; j++) {
            const angle = (j / count) * Math.PI * 2 + Math.random() * 0.5;
            const dist = radius * (0.6 + Math.random() * 0.4);

            points.push({
              x: cx + Math.cos(angle) * dist,
              y: cy + Math.sin(angle) * dist,
            });
          }

          for (let j = 0; j < count; j++) {
            const next = (j + 1) % count;
            connections.push([j, next]);

            if (Math.random() > 0.5) {
              connections.push([j, (j + 2) % count]);
            }
          }

          constellations.push({points, connections});
        }
      }

      function createShootingStar() {
        return {
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height * 0.5,
          length: Math.random() * 80 + 60,
          speed: Math.random() * 3 + 2,
          angle: Math.PI / 4,
          opacity: 0.8,
        };
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        stars.forEach((s) => {
          s.phase += s.speed;
          const glow = (Math.sin(s.phase) + 1) / 1.5;

          ctx.beginPath();
          ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,255,255,${s.opacity * glow})`;
          ctx.fill();
        });

        constellations.forEach((c) => {
          ctx.strokeStyle = "rgba(255,255,255,0.16)";
          ctx.lineWidth = 1;

          c.connections.forEach(([a, b]) => {
            const p1 = c.points[a];
            const p2 = c.points[b];

            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
          });

          c.points.forEach((p) => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(255,255,255,0.70)";
            ctx.fill();

            ctx.beginPath();
            ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(255,255,255,0.2)";
            ctx.fill();
          });
        });

        const now = Date.now();
        if (now - lastSpawn > 1500 + Math.random() * 2000) {
          shootingStars.push(createShootingStar());
          lastSpawn = now;
        }

        shootingStars = shootingStars.filter((s) => {
          if (s.opacity <= 0) return false;

          const grad = ctx.createLinearGradient(s.x, s.y, s.x - Math.cos(s.angle) * s.length, s.y - Math.sin(s.angle) * s.length);

          grad.addColorStop(0, `rgba(255,255,255,${s.opacity})`);
          grad.addColorStop(1, "rgba(255,255,255,0)");

          ctx.beginPath();
          ctx.moveTo(s.x, s.y);
          ctx.lineTo(s.x - Math.cos(s.angle) * s.length, s.y - Math.sin(s.angle) * s.length);
          ctx.strokeStyle = grad;
          ctx.lineWidth = 2;
          ctx.stroke();

          s.x += Math.cos(s.angle) * s.speed;
          s.y += Math.sin(s.angle) * s.speed;
          s.opacity -= 0.01;

          return true;
        });

        requestAnimationFrame(draw);
      }

      window.addEventListener("resize", resize);

      resize();
      draw();
    </script>

      async function fetchText(url) {
        try {
          const response = await fetch(url);
          return await response.text();
        } catch (err) {
          console.error("Fetch failed:", err);
          return null;
        }
      }

      async function openGameModal(game) {
        currentGame = game;
        overlay.classList.add("active");
        globalActionBar.style.display = "none";
        frameContainer.innerHTML = '<div style="color:white; text-align:center; margin-top:20%; font-family:Orbitron;">LOADING...</div>';

        if (game.code) {
          const fetchedCode = await fetchText(game.code);
          frameContainer.innerHTML = "";

          if (fetchedCode) {
            const wrapper = document.createElement("div");
            wrapper.id = "game-content-wrapper";
            wrapper.style.cssText = "width:100%; height:100%; overflow:auto; background:#000;";
            frameContainer.appendChild(wrapper);

            const baseUrl = game.code.substring(0, game.code.lastIndexOf("/") + 1);
            const patchedCode = fetchedCode.replace(/(src|href)=(["'])(?!https?:\/\/|data:|\/\/)([^"']+)\2/gi, `$1=$2${baseUrl}$3$2`);

            const parser = new DOMParser();
            const parsedDoc = parser.parseFromString(patchedCode, "text/html");

            parsedDoc.head.querySelectorAll("style").forEach((style) => {
              wrapper.appendChild(style.cloneNode(true));
            });

            parsedDoc.head.querySelectorAll("link[rel='stylesheet']").forEach((link) => {
              const newLink = document.createElement("link");
              newLink.rel = "stylesheet";
              newLink.href = link.href;
              wrapper.appendChild(newLink);
            });

            const bodyContent = document.createElement("div");
            bodyContent.innerHTML = parsedDoc.body.innerHTML;
            wrapper.appendChild(bodyContent);
            if (wrapper.dataset.scriptsLoaded) return;
            wrapper.dataset.scriptsLoaded = "true";

            parsedDoc.body.querySelectorAll("script").forEach((script) => {
              const newScript = document.createElement("script");
              if (script.src) {
                newScript.src = script.src;
              } else {
                newScript.textContent = script.textContent;
              }
              wrapper.appendChild(newScript);
            });
          }
        } else if (game.webgl) {
          frameContainer.innerHTML = `
            <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:white; text-align:center; font-family:sans-serif; padding: 20px; width: 100%;">
              <h2 style="margin-bottom: 10px;">WebGL Mode</h2>
              <p style="opacity: 0.8; max-width: 400px; margin-bottom: 20px;">This game requires a new window to run correctly.</p>
              <button onclick="document.getElementById('btn-fullscreen').click()" style="padding: 15px 15px; background: #3066BE; color: white; border: none; border-radius: 100px; cursor: pointer; font-size: 20px; transition: 0.2s;"><i class="fa-solid fa-expand"></i></button>
            </div>
          `;
        } else {
          try {
            const code = await fetchText(game.cdn);
            frameContainer.innerHTML = "";
            const iframe = document.createElement("iframe");
            iframe.className = "newtab-iframe";
            iframe.setAttribute("allow", "autoplay; fullscreen; keyboard-events; gamepad");
            iframe.allowFullscreen = true;
            const blob = new Blob([code], {type: "text/html"});
            iframe.src = URL.createObjectURL(blob);
            frameContainer.appendChild(iframe);
          } catch (error) {
            console.error("Load error:", error);
          }
        }
      }

      document.getElementById("btn-exit").addEventListener("click", () => {
        overlay.classList.remove("active");
        frameContainer.innerHTML = "";
        globalActionBar.style.display = "flex";
        currentGame = null;
      });

      document.getElementById("btn-fullscreen").addEventListener("click", async () => {
        if (!currentGame) return;

        const targetUrl = currentGame.code || currentGame.cdn;
        const fetchedContent = await fetchText(targetUrl);

        if (fetchedContent) {
          const newWin = window.open("about:blank", "_blank");
          if (newWin) {
            newWin.document.open();
            newWin.document.write(fetchedContent);
            newWin.document.close();

            setTimeout(function () {
              const docEl = newWin.document.documentElement;
              const requestFs = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullscreen || docEl.msRequestFullscreen;
              if (requestFs) requestFs.call(docEl);
            }, 500);
          } else {
            alert("Popup blocked! Please allow popups to launch the game.");
          }
        }
      });

      document.getElementById("btn-download").addEventListener("click", async () => {
        if (!currentGame) return;

        const targetUrl = currentGame.code || currentGame.cdn;
        const fetchedContent = await fetchText(targetUrl);

        if (fetchedContent) {
          const fileName = currentGame.title.replace(/\s+/g, "_") + ".html";
          const blob = new Blob([fetchedContent], {type: "text/html"});
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = fileName;
          a.click();
          window.URL.revokeObjectURL(url);
        }
      });
      renderGames(gamesList);

          item.className = "proxy-item proxy-pop";
          item.onclick = () => openProxyOverlay(proxy);
          item.innerHTML = `
            <img src="${proxy.proxyimgurl}" alt="${proxy.Proxy_name}" loading="lazy">
            <div class="proxy-title">${proxy.Proxy_name}</div>
          `;
          proxyGrid.appendChild(item);
        });
      }

      async function openProxyOverlay(proxy) {
        currentProxy = proxy;
        currentProxyCode = null;
        proxyOverlay.classList.add("active");
        proxyGlobalActionBar.style.display = "none";
        proxyLaunchContainer.style.display = "none";
        proxyFrameContainer.innerHTML = '<div style="color:white; text-align:center; margin-top:20%; font-family:Orbitron;">LOADING...</div>';

        try {
          const fetchedCode = await fetchText(proxy.proxyurl);
          proxyFrameContainer.innerHTML = "";

          if (fetchedCode) {
            currentProxyCode = fetchedCode;
            proxyLaunchTitle.textContent = proxy.Proxy_name;
            proxyLaunchContainer.style.display = "flex";
          } else {
            proxyFrameContainer.innerHTML = '<div style="color:white; text-align:center; margin-top:20%; font-family:Orbitron;">Failed to load proxy</div>';
          }
        } catch (error) {
          console.error("Proxy load error:", error);
          proxyFrameContainer.innerHTML = '<div style="color:white; text-align:center; margin-top:20%; font-family:Orbitron;">Failed to load proxy</div>';
        }
      }

      proxyLaunchBtn.addEventListener("click", async () => {
        if (!currentProxyCode || !currentProxy) return;

        const newWin = window.open("about:blank", "_blank");
        if (newWin) {
          newWin.document.open();
          newWin.document.write(currentProxyCode);
          newWin.document.close();
        } else {
          alert("Popup blocked! Please allow popups to launch the proxy.");
        }
      });

      document.getElementById("btn-proxy-exit").addEventListener("click", () => {
        proxyOverlay.classList.remove("active");
        proxyFrameContainer.innerHTML = "";
        proxyLaunchContainer.style.display = "none";
        proxyGlobalActionBar.style.display = "flex";
        currentProxy = null;
        currentProxyCode = null;
      });

      const proxyGlobalActionBar = document.querySelector(".action-bar");
      renderProxyList(proxiesList);
    </script>

      function abbreviateNumber(num) {
        if (num === 0) return "0";
        const suffixes = ["", "k", "M", "B", "T"];
        const suffixIndex = Math.floor(Math.log10(Math.abs(num)) / 3);
        if (suffixIndex === 0) return num.toString();
        const shortValue = num / Math.pow(1000, suffixIndex);
        const formatted = shortValue % 1 === 0 ? shortValue.toFixed(0) : shortValue.toFixed(1).replace(/\.0$/, "");
        return formatted + suffixes[suffixIndex];
      }

    <script type="module">
      import {initializeApp} from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
      import {getDatabase, ref, set, onDisconnect, onValue, runTransaction, get} from "https://www.gstatic.com/firebasejs/12.12.0/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCIw3qrDRGRZiHVZuPjTcbYoQ-mmZC1ebU",
        authDomain: "gx-gxmes.firebaseapp.com",
        databaseURL: "https://gx-gxmes-default-rtdb.firebaseio.com",
        projectId: "gx-gxmes",
        storageBucket: "gx-gxmes.firebasestorage.app",
        messagingSenderId: "599432055709",
        appId: "1:599432055709:web:9c5910a40ea78c0e1fbd74",
      };

      function showFirebaseError() {
        const liveEl = document.getElementById("home-live");
        const allEl = document.getElementById("home-all");
        if (liveEl) {
          liveEl.textContent = "404";
          liveEl.style.color = "#ff0000";
        }
        if (allEl) {
          allEl.textContent = "404";
          allEl.style.color = "#ff0000";
        }
      }

      try {
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let firebaseUserId = localStorage.getItem("userUUID");
        if (!firebaseUserId) {
          firebaseUserId = crypto.randomUUID();
          localStorage.setItem("userUUID", firebaseUserId);
        }
        const userRef = ref(db, "onlineUsers/" + firebaseUserId);

        let banOverlayShown = false;
        let originalContent = '';

        function showBanOverlay(banMessage) {
          if (banOverlayShown) return;
          banOverlayShown = true;

          const originalElements = Array.from(document.body.children);
          const hiddenWrapper = document.createElement('div');
          hiddenWrapper.id = 'original-content-wrapper';
          hiddenWrapper.style.cssText = 'display:none;';

          originalElements.forEach(el => {
            if (el.id !== 'ban-overlay') {
              hiddenWrapper.appendChild(el);
            }
          });
          document.body.appendChild(hiddenWrapper);

          const placeholderCdnUrl = "https://raw.githubusercontent.com/Kingtian20/gxmes-gx/refs/heads/main/utils/bans/banned.html";

          fetch(placeholderCdnUrl)
            .then(response => response.text())
            .then(banContent => {
              const processedContent = banContent
                .replace(/{{BAN_MESSAGE}}/g, banMessage)
                .replace(/{{USER_UUID}}/g, firebaseUserId);

              const banWrapper = document.createElement('div');
              banWrapper.id = 'ban-overlay';
              banWrapper.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;';
              banWrapper.innerHTML = processedContent;
              document.body.appendChild(banWrapper);

              const scripts = banWrapper.querySelectorAll('script');
              scripts.forEach(script => {
                const newScript = document.createElement('script');
                if (script.src) {
                  newScript.src = script.src;
                } else {
                  newScript.textContent = script.textContent;
                }
                document.body.appendChild(newScript);
                script.remove();
              });
            })
            .catch(() => {
              const banWrapper = document.createElement('div');
              banWrapper.id = 'ban-overlay';
              banWrapper.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;';
              banWrapper.innerHTML = `
                <div style="position:fixed;top:0;left:0;right:0;bottom:0;background:#000;display:flex;align-items:center;justify-content:center;">
                  <div style="text-align:center;color:#fff;font-family:sans-serif;">
                    <h1 style="color:#ff4444;text-shadow:0 0 20px #ff4444;font-size:3rem;margin-bottom:1rem;">BANNED</h1>
                    <p style="color:#888;font-size:1.2rem;margin-bottom:0.5rem;">${banMessage}</p>
                    <p style="color:#555;font-size:0.875rem;">UUID: ${firebaseUserId}</p>
                  </div>
                </div>
              `;
              document.body.appendChild(banWrapper);
            });
        }

        function removeBanOverlay() {
          if (!banOverlayShown) return;
          banOverlayShown = false;

          const overlay = document.getElementById('ban-overlay');
          if (overlay) {
            overlay.remove();
          }

          const hiddenWrapper = document.getElementById('original-content-wrapper');
          if (hiddenWrapper) {
            const originalElements = Array.from(hiddenWrapper.children);
            originalElements.forEach(el => {
              document.body.appendChild(el);
            });
            hiddenWrapper.remove();
          }
        }

        function initBanListener() {
          const bannedUserRef = ref(db, "bannedUsers/" + firebaseUserId);
          onValue(bannedUserRef, (snapshot) => {
            if (snapshot.exists()) {
              const banData = snapshot.val();
              const banMessage = banData.banMessage || "You have been banned.";
              showBanOverlay(banMessage);
            } else {
              removeBanOverlay();
            }
          });
        }

        async function initUser() {
          initBanListener();

          set(userRef, true).catch(showFirebaseError);
          onDisconnect(userRef).remove().catch(showFirebaseError);

          onValue(
            ref(db, "onlineUsers"),
            (snap) => {
              const data = snap.val();
              const count = data ? Object.keys(data).length : 0;
              document.getElementById("home-live").textContent = abbreviateNumber(count);
            },
            showFirebaseError,
          );

          let sessionId = localStorage.getItem("sessionId");

          if (!sessionId) {
            sessionId = crypto.randomUUID();
            localStorage.setItem("sessionId", sessionId);

            runTransaction(ref(db, "stats/allTime"), (current) => {
              return (current || 0) + 1;
            }).catch(showFirebaseError);
          }

          onValue(
            ref(db, "stats/allTime"),
            (snap) => {
              const count = snap.val() || 0;
              document.getElementById("home-all").textContent = abbreviateNumber(count);
            },
            showFirebaseError,
          );
        }

        initUser();
      } catch (error) {
        showFirebaseError();
      }
    </script>
