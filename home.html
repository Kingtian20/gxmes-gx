<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://kit.fontawesome.com/48def32dfd.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css?family=Orbitron" rel="stylesheet" />
    <title>GX Verse</title>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --primary-color: #0000ff;
        --secondary-color: #00fff7;
      }

      body {
        width: 100vw;
        height: 100vh;
        background-color: #000;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      section {
        position: relative;
      }

      .main-title {
        position: absolute;
        top: 30%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: clamp(2.5rem, 8vw, 5rem);
        font-weight: bold;
        font-family: "Orbitron", sans-serif;
        color: #fff;
        text-transform: uppercase;
        letter-spacing: clamp(2px, 1vw, 4px);
        animation: glitch 2s infinite;
        text-align: center;
        white-space: nowrap;
        z-index: 5;
      }

      .main-title::before,
      .main-title::after {
        content: "GX VERSE";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        overflow: hidden;
      }

      .sub-title::before,
      .sub-title::after {
        content: "Welcome to GX VERSE";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        overflow: hidden;
      }

      .main-title::before,
      .sub-title::before {
        color: var(--secondary-color);
        z-index: -1;
      }

      .main-title::after,
      .sub-title::after {
        color: var(--primary-color);
        z-index: -2;
      }

      @keyframes glitch {
        0% {
          text-shadow:
            0 0 2px #fff,
            0 0 10px var(--primary-color);
        }
        20% {
          text-shadow:
            -2px 0 var(--secondary-color),
            2px 2px var(--primary-color);
        }
        40% {
          text-shadow:
            2px -2px var(--secondary-color),
            -2px 2px var(--primary-color);
        }
        60% {
          text-shadow:
            0 0 3px #fff,
            0 0 15px var(--primary-color);
        }
        80% {
          text-shadow:
            2px 0 var(--secondary-color),
            -2px -2px var(--primary-color);
        }
        100% {
          text-shadow:
            0 0 2px #fff,
            0 0 10px var(--primary-color);
        }
      }

      .home {
        width: 100vw;
        height: 100vh;
        padding: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .search-container {
        width: 100%;
        max-width: 400px;
        margin: 0 auto;
        position: relative;
      }

      .search-box {
        position: relative;
        width: 100%;
        height: 54px;
        background: #000;
        border-radius: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      .line-driver {
        position: absolute;
        inset: 0;
        border-radius: 100px;
        z-index: -1;
        overflow: hidden;

        -webkit-mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        padding: 2px;
      }

      .line-driver::before {
        content: "";
        position: absolute;
        width: 500px;
        height: 500px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: conic-gradient(from 0deg, transparent 0%, var(--primary-color) 10%, var(--secondary-color) 20%, transparent 25%);
        animation: rotate 3s linear infinite;
        filter: drop-shadow(0 0 15px var(--primary-color)) drop-shadow(0 0 5px var(--secondary-color)) drop-shadow(0 0 50px var(--primary-color));
      }

      .search-box input {
        width: 100%;
        height: 100%;
        padding: 0 25px;
        border: none;
        background: transparent;
        color: #fff;
        font-size: 1.1rem;
        outline: none;
        font-family: "Orbitron", sans-serif;
      }

      @keyframes rotate {
        from {
          transform: translate(-50%, -50%) rotate(0deg);
        }
        to {
          transform: translate(-50%, -50%) rotate(360deg);
        }
      }

      .search-box:hover {
        transform: scale(1.05);
      }

      .search-box:focus-within {
        transform: scale(1.02);
      }

      .search-box:focus-within .line-driver {
        filter: drop-shadow(0 0 12px var(--secondary-color));
      }

      .action-bar {
        display: flex;
        flex-direction: row;
        justify-content: space-evenly;
        align-items: center;
        width: 320px;
        padding: 10px 15px;
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background-color: #000;
        border-radius: 100px;
        z-index: 10;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      .action-bar:hover {
        transform: translateX(-50%) scale(1.05);
      }

      .action-bar button {
        width: 45px;
        height: 45px;
        border: none;
        border-radius: 50%;
        background-color: transparent;
        color: rgba(255, 255, 255, 0.6);
        font-size: 1.3rem;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        cursor: pointer;
        z-index: 2;
      }

      .action-bar button:hover {
        color: var(--primary-color);
        transform: translateY(-5px) scale(1.2);
        filter: drop-shadow(0 0 10px var(--primary-color));
      }

      #home-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
      }

      .g-circle {
        position: relative;
        display: inline-block;
        color: #fff;
        z-index: 5;
        perspective: 600px;
        animation: glow 10s linear infinite;
      }

      @keyframes glow {
        0% {
          filter: drop-shadow(0 0 10px #ffff00);
        }
        50% {
          filter: drop-shadow(0 0 1px #ffff00);
        }
        100% {
          filter: drop-shadow(0 0 10px #ffff00);
        }
      }

      .g-circle::before,
      .g-circle::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 1.4em;
        height: 1.4em;
        border: 10px solid #ffff00;
        border-radius: 50%;
        pointer-events: none;
        transform: translate(-50%, -50%) rotateX(70deg) rotateY(-20deg);

        box-shadow:
          0 0 10px rgba(255, 255, 0, 0.6),
          inset 0 0 10px rgba(255, 255, 0, 0.6);
      }

      .g-circle::before {
        z-index: -1;
      }

      .g-circle::after {
        z-index: 1;
        clip-path: inset(50% 0 0 0);
      }

      .grid {
        width: 90%;
        max-width: 1200px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 30px;
        margin-top: 80px;
        padding-bottom: 100px;
      }

      .game-item {
        aspect-ratio: 1/1;
        background: #111;
        border: 2px solid transparent;
        border-radius: 14px;
        position: relative;
        overflow: hidden;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 0 10px rgba(0, 0, 255, 0.2);
      }

      .game-item:hover {
        transform: translateY(-10px) scale(1.05);
        border-color: white;
        box-shadow: 0 0 20px var(--primary-color);
        z-index: 2;
      }

      .game-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.3s ease;
      }

      .game-item:hover img {
        transform: scale(1.1);
        opacity: 0.5;
      }

      .game-title {
        position: absolute;
        bottom: -60px;
        width: 100%;
        padding: 15px 10px;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
        text-align: center;
        font-family: "Orbitron", sans-serif;
        color: white;
        font-weight: bold;
        transition: bottom 0.3s ease-out;
      }

      .game-item:hover .game-title {
        bottom: 0;
      }

      .game-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #000;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        transform: translateY(100%);
        visibility: hidden;
        pointer-events: none;
        transition:
          transform 0.5s cubic-bezier(0.25, 1, 0.5, 1),
          visibility 0.5s;
      }

      .game-overlay.active {
        transform: translateY(0);
        visibility: visible;
        pointer-events: auto;
      }

      #game-overlay.active ~ .action-bar {
        display: none !important;
      }

      #game-frame-container {
        flex: 1;
        width: 100%;
        background: #111;
      }

      .newtab-iframe {
        width: 100%;
        height: 100%;
        border: none;
      }

      .game-controls {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        width: 320px;
        height: 65px;
        background: #000;
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 100px;
        display: flex;
        justify-content: space-evenly;
        align-items: center;
        gap: 10px;
        padding: 0 15px;
        box-shadow:
          0 10px 30px rgba(0, 0, 0, 0.5),
          0 0 20px rgba(0, 255, 247, 0.1);
        z-index: 10000;
      }

      .game-controls button {
        width: 45px;
        height: 45px;
        border: none;
        border-radius: 50%;
        background: transparent;
        color: rgba(255, 255, 255, 0.6);
        font-size: 1.2rem;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
      }

      .game-controls button:hover {
        color: var(--primary-color);
        transform: translateY(-5px) scale(1.2);
        filter: drop-shadow(0 0 10px var(--primary-color));
      }

      .action-bar button::after,
      .game-controls button::after {
        content: attr(title);
        position: absolute;
        top: -45px;
        left: 50%;
        transform: translateX(-50%) scale(0.8);
        font-family: "Orbitron", sans-serif;
        font-size: 0.7rem;
        font-weight: bold;
        color: #000;
        background: var(--primary-color);
        padding: 4px 10px;
        border-radius: 4px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      .action-bar button:hover::after,
      .game-controls button:hover::after {
        opacity: 1;
        transform: translateX(-50%) scale(1);
        top: -50px;
      }

      .action-bar button::before,
      .game-controls button::before {
        content: "";
        position: absolute;
        top: -15px;
        left: 50%;
        transform: translateX(-50%);
        border-width: 5px;
        border-style: solid;
        border-color: var(--primary-color) transparent transparent transparent;
        opacity: 0;
        transition: opacity 0.2s;
      }

      .action-bar button:hover::before,
      .game-controls button:hover::before {
        opacity: 1;
      }

      .search-wrapper {
        position: sticky;
        top: 20px;
        width: 100%;
        display: flex;
        justify-content: center;
        padding: 15px 0;
        z-index: 100;
        background: transparent;
        pointer-events: none;
      }

      #gxmes-page .search-box {
        width: 80%;
        max-width: 800px;
        height: 60px;
        pointer-events: all;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(10px);
      }

      #gxmes-page .search-box input {
        font-size: 1rem;
        pointer-events: all;
        letter-spacing: 1px;
      }

      #gxmes-page .line-driver::before {
        width: 1000px;
        height: 1000px;
      }

      #gxmes-page {
        background-color: #000 !important;
        min-height: 100vh;
      }

      .version-label {
        position: absolute;
        bottom: 10px;
        left: 10px;
        font-family: "Orbitron", sans-serif;
        font-size: 0.7rem;
        font-weight: bold;
        color: #ffffffb7;
        background: transparent;
        padding: 4px 10px;
        border-radius: 4px;
        white-space: nowrap;
        opacity: 0.5;
      }

      .page-fade {
        animation: fadeInPage 0.4s ease-out forwards;
      }

      @keyframes fadeInPage {
        from {
          opacity: 0;
          transform: scale(0.98);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .game-pop {
        animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }

      @keyframes popIn {
        from {
          opacity: 0;
          transform: scale(0.5);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div class="action-bar">
      <div class="line-driver"></div>
      <button title="Home" id="homeBtn"><i class="fa-solid fa-house"></i></button>
      <button title="Gxmes" id="gxmesBtn"><i class="fa-solid fa-gamepad"></i></button>
      <button title="Info" id="contactBtn"><i class="fa-solid fa-address-book"></i></button>
      <button title="Pr0xys" id="proxyBtn"><i class="fa-solid fa-cloud"></i></button>
      <button title="Sound Board" id="soundsBtn"><i class="fa-solid fa-volume"></i></button>
    </div>
    <canvas id="home-canvas"></canvas>

    <section class="home" id="home-page">
      <h1 class="main-title"><span class="g-circle">G</span>X VERSE</h1>
      <h1 class="sub-title main-title" style="font-size: 1rem; position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%)">Welcome to GX VERSE</h1>
      <div class="search-container">
        <div class="search-box">
          <div class="line-driver"></div>
          <input type="text" id="home-search" autocomplete="off" autofocus autocapitalize="off" autocorrect="off" placeholder="Search gxmes..." />
        </div>
      </div>
      <label class="version-label">Ver 0.0.1 BETA</label>
    </section>

    <section class="gxmes" id="gxmes-page" style="display: none; width: 100vw; height: 100vh; flex-direction: column; align-items: center; overflow-y: auto">
      <div class="search-wrapper">
        <div class="search-box">
          <div class="line-driver"></div>
          <input type="text" id="game-search" placeholder="Search gxmes..." autocomplete="off" />
        </div>
      </div>

      <div class="grid" id="game-grid"></div>
    </section>

    <div id="game-overlay" class="game-overlay">
      <div id="game-frame-container"></div>

      <div class="game-controls">
        <button id="btn-fullscreen" title="Fullscreen"><i class="fa-solid fa-expand"></i></button>
        <button id="btn-download" title="Download"><i class="fa-solid fa-download"></i></button>
        <button id="btn-exit" title="Exit"><i class="fa-solid fa-xmark"></i></button>
      </div>
    </div>

    <script>
      const homePage = document.getElementById("home-page");
      const gxmesPage = document.getElementById("gxmes-page");
      const homeBtn = document.getElementById("homeBtn");
      const gxmesBtn = document.getElementById("gxmesBtn");
      const mainTitle = document.querySelector(".main-title");
      const subTitle = document.querySelector(".sub-title");

      homeBtn.addEventListener("click", () => {
        homePage.style.display = "flex";
        gxmesPage.style.display = "none";
        homePage.classList.remove("page-fade");
        void homePage.offsetWidth;
        homePage.classList.add("page-fade");
        if (mainTitle) {
          mainTitle.style.animation = "none";
          void mainTitle.offsetWidth;
          mainTitle.style.animation = "glitch 2s infinite";
        }
        if (subTitle) {
          subTitle.style.animation = "none";
          void subTitle.offsetWidth;
          subTitle.style.animation = "glitch 2s infinite";
        }
      });

      gxmesBtn.addEventListener("click", () => {
        homePage.style.display = "none";
        gxmesPage.style.display = "flex";
        gameSearch.focus();
        gxmesPage.classList.remove("page-fade");
        void gxmesPage.offsetWidth;
        gxmesPage.classList.add("page-fade");
      });

      const homeSearch = document.getElementById("home-search");
      const gameSearch = document.getElementById("game-search");

      homeSearch.addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
          gameSearch.value = homeSearch.value;
          gameSearch.dispatchEvent(new Event("input", {bubbles: true}));
          homeSearch.value = "";

          homePage.style.display = "none";
          gxmesPage.style.display = "flex";

          gxmesPage.classList.remove("page-fade");
          void gxmesPage.offsetWidth;
          gxmesPage.classList.add("page-fade");
        }
      });
    </script>

    <script>
      const canvas = document.getElementById("home-canvas");
      const ctx = canvas.getContext("2d");

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const constellations = [];
      const constellationCount = 11;
      const starsPerConstellation = 6;

      function createConstellation(cx, cy) {
        const stars = [];
        const connections = [];

        const vx = (Math.random() - 0.5) * 0.2;
        const vy = (Math.random() - 0.5) * 0.2;

        for (let i = 0; i < starsPerConstellation; i++) {
          stars.push({
            ox: (Math.random() - 0.5) * 150,
            oy: (Math.random() - 0.5) * 150,
            twinkle: Math.random() * Math.PI * 5,
          });

          if (i > 0) {
            connections.push([i - 1, i]);
          }
        }

        return {cx, cy, vx, vy, stars, connections};
      }

      for (let i = 0; i < constellationCount; i++) {
        constellations.push(createConstellation(Math.random() * canvas.width, Math.random() * canvas.height));
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        constellations.forEach((c) => {
          c.cx += c.vx;
          c.cy += c.vy;

          if (c.cx < 0 || c.cx > canvas.width) c.vx *= -1;
          if (c.cy < 0 || c.cy > canvas.height) c.vy *= -1;

          c.connections.forEach(([a, b]) => {
            const s1 = c.stars[a];
            const s2 = c.stars[b];

            const x1 = c.cx + s1.ox;
            const y1 = c.cy + s1.oy;
            const x2 = c.cx + s2.ox;
            const y2 = c.cy + s2.oy;

            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.strokeStyle = "rgba(255,255,255, 0.5)";
            ctx.lineWidth = 1;
            ctx.stroke();
          });

          c.stars.forEach((star) => {
            star.twinkle += 0.03;

            const x = c.cx + star.ox;
            const y = c.cy + star.oy;
            const brightness = 0.6 + Math.sin(star.twinkle) * 0.5;

            ctx.beginPath();
            ctx.arc(x, y, 2 + brightness, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255,255,255,${brightness})`;
            ctx.fill();
          });
        });

        requestAnimationFrame(animate);
      }

      animate();
    </script>

    <script>
      const gamesList = [
        {
          title: "1v1 Lol",
          image: "https://raw.githubusercontent.com/Kingtian20/search-embeds/images/147.png",
          cdn: "https://raw.githubusercontent.com/Kingtian20/gxmes-gx/main/1v1lol/1v1lol.xml",
          webgl: false,
        },
        {
          title: "1v1 Tennis",
          image: "https://raw.githubusercontent.com/Kingtian20/search-embeds/images/1.png",
          cdn: "https://raw.githubusercontent.com/Kingtian20/gxmes-gx/main/1v1tennis/1v1tennis.xml",
          webgl: false,
        },
        {
          title: "Death Run 3D",
          image: "https://raw.githubusercontent.com/Kingtian20/search-embeds/images/30.png",
          cdn: "https://raw.githubusercontent.com/Kingtian20/gxmes-gx/main/deathrun3d/deathrun3d.xml",
          webgl: true,
        },
        {
          title: "Slope 3",
          image: "https://raw.githubusercontent.com/Kingtian20/search-embeds/images/115.png",
          cdn: "https://raw.githubusercontent.com/Kingtian20/gxmes-gx/main/slope/slope3/slope3.xml",
          webgl: false,
        },
        {
          title: "Ultrakill",
          image: "https://raw.githubusercontent.com/Kingtian20/search-embeds/images/132.png",
          cdn: "https://raw.githubusercontent.com/Kingtian20/gxmes-gx/main/ultrakill/index.html",
          webgl: true,
        },
        {
          title: "Bacon May Die",
          image: "https://raw.githubusercontent.com/Kingtian20/search-embeds/images/204.png",
          cdn: "https://raw.githubusercontent.com/Kingtian20/gxmes-gx/main/baconmaydie/baconmaydie.xml",
          webgl: true,
        },
        {
          title: "Drift Race",
          image: "https://raw.githubusercontent.com/Kingtian20/search-embeds/images/32.png",
          cdn: "https://raw.githubusercontent.com/Kingtian20/gxmes-gx/main/driftrace/driftrace.xml",
          webgl: true,
        },
        {
          title: "Only Up",
          image: "https://raw.githubusercontent.com/Kingtian20/search-embeds/images/32.png",
          cdn: "https://raw.githubusercontent.com/Kingtian20/gxmes-gx/main/onlyup/onlyup.xml",
          webgl: true,
        },
      ];


      gamesList.sort((a, b) => a.title.localeCompare(b.title, undefined, {numeric: true, sensitivity: "base"}));

      const gameGrid = document.getElementById("game-grid");
      const searchInput = document.getElementById("game-search");
      const overlay = document.getElementById("game-overlay");
      const frameContainer = document.getElementById("game-frame-container");
      const globalActionBar = document.querySelector(".action-bar");

      let currentGameCDN = "";
      let isCurrentGameWebGL = false;

      function renderGames(games) {
        gameGrid.innerHTML = "";
        games.forEach((game) => {
          const item = document.createElement("div");
          item.className = "game-item game-pop";
          item.onclick = () => openGameModal(game);
          item.innerHTML = `
            <img src="${game.image}" alt="${game.title}" loading="lazy">
            <div class="game-title">${game.title}</div>
          `;
          gameGrid.appendChild(item);
        });
      }

      searchInput.addEventListener("input", (e) => {
        const term = e.target.value.toLowerCase();
        renderGames(gamesList.filter((game) => game.title.toLowerCase().includes(term)));
      });

      async function openGameModal(game) {
        currentGameCDN = game.cdn;
        isCurrentGameWebGL = game.webgl;

        overlay.classList.add("active");
        globalActionBar.style.display = "none";
        frameContainer.innerHTML = "";

        if (game.webgl) {
          frameContainer.innerHTML = `
            <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:white; text-align:center; font-family:sans-serif; padding: 20px; width: 100%;">
              <h2 style="margin-bottom: 10px;">WebGL Mode</h2>
              <p style="opacity: 0.8; max-width: 400px; margin-bottom: 20px;">This game requires a new window to run correctly.</p>
              <p style="opacity: 0.8; max-width: 400px; margin-bottom: 20px;">Blob URLs don't support WebGL, which is our method for rendering fetched files.</p>
              <button onclick="document.getElementById('btn-fullscreen').click()" style="padding: 15px 15px; background: #3066BE; color: white; border: none; border-radius: 100px; cursor: pointer; font-size: 20px; transition: 0.2s;"><i class="fa-solid fa-expand"></i></button>
            </div>
          `;
        } else {
          const iframe = document.createElement("iframe");
          iframe.className = "newtab-iframe";
          iframe.setAttribute("allow", "autoplay; fullscreen; keyboard-events; gamepad");
          iframe.allowFullscreen = true;

          try {
            const response = await fetch(game.cdn);
            const code = await response.text();
            const blob = new Blob([code], {type: "text/html"});
            iframe.src = URL.createObjectURL(blob);
            frameContainer.appendChild(iframe);
          } catch (error) {
            console.error("Load error:", error);
          }
        }
      }

      document.getElementById("btn-exit").addEventListener("click", () => {
        overlay.classList.remove("active");
        frameContainer.innerHTML = "";
        globalActionBar.style.display = "flex";
        currentGameCDN = "";
      });

      document.getElementById("btn-fullscreen").addEventListener("click", () => {
        if (!currentGameCDN) return;

        var xhr = new XMLHttpRequest();
        xhr.onreadystatechange = function () {
          if (xhr.readyState == 4 && xhr.status == 200) {
            var newWin = window.open("about:blank", "_blank");
            if (newWin) {
              newWin.document.open();
              newWin.document.write(xhr.responseText);
              newWin.document.close();

              setTimeout(function () {
                const docEl = newWin.document.documentElement;
                const requestFs = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullscreen || docEl.msRequestFullscreen;
                if (requestFs) requestFs.call(docEl);
              }, 500);
            } else {
              alert("Popup blocked! Please allow popups to launch the game.");
            }
          }
        };
        xhr.open("GET", currentGameCDN);
        xhr.send();
      });

      document.getElementById("btn-download").addEventListener("click", () => {
        if (!currentGameCDN) return;

        const game = gamesList.find((g) => g.cdn === currentGameCDN);
        const fileName = game ? game.title.replace(/\s+/g, "_") + ".html" : "game.html";

        var xhr = new XMLHttpRequest();
        xhr.onreadystatechange = function () {
          if (xhr.readyState == 4 && xhr.status == 200) {
            const blob = new Blob([xhr.responseText], {type: "text/html"});
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = fileName;
            a.click();
            window.URL.revokeObjectURL(url);
          }
        };
        xhr.open("GET", currentGameCDN);
        xhr.send();
      });

      renderGames(gamesList);
    </script>
  </body>
</html>
