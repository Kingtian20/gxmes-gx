<!doctype html>
<html lang="en">
  <head>

    <meta charset="UTF-8" />

    <link href="https://fonts.googleapis.com/css?family=Orbitron" rel="stylesheet" />
    <title>GX Verse</title>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --primary-color: #0000ff;
        --secondary-color: #00fff7;
      }

      body {
        width: 100vw;
        height: 100vh;
        background-color: #000;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      section {
        position: relative;
      }

      .main-title {
        position: absolute;
        top: 30%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: clamp(2.5rem, 8vw, 5rem);
        font-weight: bold;
        font-family: "Orbitron", sans-serif;
        color: #fff;
        text-transform: uppercase;
        letter-spacing: clamp(2px, 1vw, 4px);
        animation: glitch 2s infinite;
        text-align: center;
        white-space: nowrap;
        z-index: 5;
      }

      .main-title::before,
      .main-title::after {
        content: "GX VERSE";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        overflow: hidden;
      }

      .sub-title::before,
      .sub-title::after {
        content: "Welcome to GX VERSE";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        overflow: hidden;
      }

      .main-title::before,
      .sub-title::before {
        color: var(--secondary-color);
        z-index: -1;
      }

      .main-title::after,
      .sub-title::after {
        color: var(--primary-color);
        z-index: -2;
      }

      .home {
        width: 100vw;
        height: 100vh;
        padding: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .search-container {
        width: 100%;
        max-width: 400px;
        margin: 0 auto;
        position: relative;
      }

      .search-box {
        position: relative;
        width: 100%;
        height: 54px;
        background: #000;
        border-radius: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      .search-box input {
        width: 100%;
        height: 100%;
        padding: 0 25px;
        border: none;
        background: transparent;
        color: #fff;
        font-size: 1.1rem;
        outline: none;
        font-family: "Orbitron", sans-serif;
      }

      .search-box:hover {
        transform: scale(1.05);
      }

      .search-box:focus-within {
        transform: scale(1.02);
      }

      .search-box:focus-within .line-driver {
        filter: drop-shadow(0 0 12px var(--secondary-color));
      }

      .line-driver {
        position: absolute;
        inset: 0;
        border-radius: 100px;
        z-index: -1;
        overflow: hidden;
        -webkit-mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        padding: 2px;
      }

      .line-driver::before {
        content: "";
        position: absolute;
        width: 500px;
        height: 500px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: conic-gradient(from 0deg, transparent 0%, var(--primary-color) 10%, var(--secondary-color) 20%, transparent 25%);
        animation: rotate 3s linear infinite;
        filter: drop-shadow(0 0 15px var(--primary-color)) drop-shadow(0 0 5px var(--secondary-color)) drop-shadow(0 0 50px var(--primary-color));
      }

      .action-bar {
        display: flex;
        flex-direction: row;
        justify-content: space-evenly;
        align-items: center;
        width: 320px;
        padding: 10px 15px;
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background-color: #000;
        border-radius: 100px;
        z-index: 10;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      .action-bar:hover {
        transform: translateX(-50%) scale(1.05);
      }

      .action-bar button {
        width: 45px;
        height: 45px;
        border: none;
        border-radius: 50%;
        background-color: transparent;
        color: rgba(255, 255, 255, 0.6);
        font-size: 1.3rem;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        cursor: pointer;
        z-index: 2;
      }

      .action-bar button:hover {
        color: var(--primary-color);
        transform: translateY(-5px) scale(1.2);
        filter: drop-shadow(0 0 10px var(--primary-color));
      }

      #home-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
      }

      .g-circle {
        position: relative;
        display: inline-block;
        color: #fff;
        z-index: 5;
        perspective: 600px;
        animation: glow 10s linear infinite;
      }

      .g-circle::before,
      .g-circle::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 1.4em;
        height: 1.4em;
        border: 10px solid #ffff00;
        border-radius: 50%;
        pointer-events: none;
        transform: translate(-50%, -50%) rotateX(70deg) rotateY(-20deg);

        box-shadow:
          0 0 10px rgba(255, 255, 0, 0.6),
          inset 0 0 10px rgba(255, 255, 0, 0.6);
      }

      .g-circle::before {
        z-index: -1;
      }

      .g-circle::after {
        z-index: 1;
        clip-path: inset(50% 0 0 0);
      }

      .grid {
        width: 90%;
        max-width: 1200px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 30px;
        margin-top: 80px;
        padding-bottom: 100px;
      }

      .game-item {
        aspect-ratio: 1/1;
        background: #111;
        border: 2px solid transparent;
        border-radius: 14px;
        position: relative;
        overflow: hidden;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 0 10px rgba(0, 0, 255, 0.2);
      }

      .game-item:hover {
        transform: translateY(-10px) scale(1.05);
        border-color: white;
        box-shadow: 0 0 20px var(--primary-color);
        z-index: 2;
      }

      .game-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.3s ease;
      }

      .game-item:hover img {
        transform: scale(1.1);
        opacity: 0.5;
      }

      .game-title {
        position: absolute;
        bottom: -60px;
        width: 100%;
        padding: 15px 10px;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
        text-align: center;
        font-family: "Orbitron", sans-serif;
        color: white;
        font-weight: bold;
        transition: bottom 0.3s ease-out;
      }

      .game-item:hover .game-title {
        bottom: 0;
      }

      .game-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #000;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        transform: translateY(100%);
        visibility: hidden;
        pointer-events: none;
        transition:
          transform 0.5s cubic-bezier(0.25, 1, 0.5, 1),
          visibility 0.5s;
      }

      .game-overlay.active {
        transform: translateY(0);
        visibility: visible;
        pointer-events: auto;
      }

      #game-overlay.active ~ .action-bar {
        display: none !important;
      }

      #game-frame-container {
        flex: 1;
        width: 100%;
        background: #111;
      }

      .newtab-iframe {
        width: 100%;
        height: 100%;
        border: none;
      }

      .game-controls {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        width: 320px;
        height: 65px;
        background: #000;
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 100px;
        display: flex;
        justify-content: space-evenly;
        align-items: center;
        gap: 10px;
        padding: 0 15px;
        box-shadow:
          0 10px 30px rgba(0, 0, 0, 0.5),
          0 0 20px rgba(0, 255, 247, 0.1);
        z-index: 10000;
      }

      .game-controls button {
        width: 45px;
        height: 45px;
        border: none;
        border-radius: 50%;
        background: transparent;
        color: rgba(255, 255, 255, 0.6);
        font-size: 1.2rem;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
      }

      .game-controls button:hover {
        color: var(--primary-color);
        transform: translateY(-5px) scale(1.2);
        filter: drop-shadow(0 0 10px var(--primary-color));
      }

      .action-bar button::after,
      .game-controls button::after {
        content: attr(title);
        position: absolute;
        top: -45px;
        left: 50%;
        transform: translateX(-50%) scale(0.8);
        font-family: "Orbitron", sans-serif;
        font-size: 0.7rem;
        font-weight: bold;
        color: #000;
        background: var(--primary-color);
        padding: 4px 10px;
        border-radius: 4px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      .action-bar button:hover::after,
      .game-controls button:hover::after,
      .action-bar button.show-tooltip::after,
      .game-controls button.show-tooltip::after {
        opacity: 1;
        transform: translateX(-50%) scale(1);
        top: -50px;
      }

      .action-bar button::before,
      .game-controls button::before {
        content: "";
        position: absolute;
        top: -15px;
        left: 50%;
        transform: translateX(-50%);
        border-width: 5px;
        border-style: solid;
        border-color: var(--primary-color) transparent transparent transparent;
        opacity: 0;
        transition: opacity 0.3s;
      }

      .action-bar button:hover::before,
      .game-controls button:hover::before,
      .action-bar button.show-tooltip::before,
      .game-controls button.show-tooltip::before {
        opacity: 1;
      }

      .search-wrapper {
        position: sticky;
        top: 20px;
        width: 100%;
        display: flex;
        justify-content: center;
        padding: 15px 0;
        z-index: 100;
        background: transparent;
        pointer-events: none;
      }

      #gxmes-page .search-box {
        width: 80%;
        max-width: 800px;
        height: 60px;
        pointer-events: all;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(10px);
      }

      #gxmes-page .search-box input {
        font-size: 1rem;
        pointer-events: all;
        letter-spacing: 1px;
      }

      #gxmes-page .line-driver::before {
        width: 1000px;
        height: 1000px;
      }

      #gxmes-page {
        background-color: #000 !important;
        min-height: 100vh;
      }

      .version-label {
        position: absolute;
        bottom: 10px;
        left: 10px;
        font-family: "Orbitron", sans-serif;
        font-size: 0.7rem;
        font-weight: bold;
        color: #ffffffb7;
        background: transparent;
        padding: 4px 10px;
        border-radius: 4px;
        white-space: nowrap;
        opacity: 0.5;
      }

      .page-fade {
        animation: fadeInPage 0.4s ease-out forwards;
      }

      .game-pop {
        animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }

      .staff-grid {
        width: 90%;
        max-width: 1200px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 2fr));
        gap: 30px;
        margin: 0 auto;
        margin-top: 250px;
        align-content: center;
        justify-content: center;
        padding: 10%;
      }

      .staff-card {
        width: 90%;
        height: 450px;
        position: relative;
        background: transparent;
        border-radius: 40px;
        align-items: center;
        text-align: center;
        justify-content: center;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      .staff-card:hover {
        transform: translateY(-10px) scale(1.02);
      }

      .staff-card:hover .staff-box .line-driver {
        filter: drop-shadow(0 0 15px var(--primary-color)) drop-shadow(0 0 5px var(--secondary-color)) drop-shadow(0 0 50px var(--primary-color));
      }

      .staff-rank {
        font-family: "Orbitron";
        margin: 20px;
        font-size: 40px;
        transform: translateY(20px);
        text-shadow:
          0 0 2px #fff,
          0 0 10px var(--primary-color);
      }

      .staff-name {
        font-family: "Orbitron";
        font-size: 30px;
        text-shadow:
          0 0 2px #fff,
          0 0 10px var(--primary-color);
      }

      .staff-img-wrapper {
        position: relative;
        width: 120px;
        height: 120px;
        margin: 10px auto;
        border-radius: 100%;
        padding: 4px;
      }

      .staff-img {
        border-radius: 50%;
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: relative;
        z-index: -1;
      }

      .staff-img-wrapper .line-driver {
        border-radius: 50% !important;
      }

      .staff-card:hover .staff-img-wrapper .line-driver {
        filter: drop-shadow(0 0 15px var(--primary-color)) drop-shadow(0 0 5px var(--secondary-color)) drop-shadow(0 0 50px var(--primary-color));
      }

      .staff-info ul {
        list-style: none;
        padding: 0;
        margin-top: 15px;
        justify-content: left;
      }

      .staff-info li {
        font-family: "Orbitron", sans-serif;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.8);
        padding: 5px 0;
        text-shadow: 0 0 5px rgba(0, 255, 247, 0.3);
      }

      .staff-box {
        position: relative;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        border-radius: 40px;
        z-index: 1;
      }

      .staff-box .line-driver {
        z-index: 2;
        border-radius: 40px;
        padding: 4px;
      }

      .staff-box .line-driver::before {
        background: conic-gradient(from 0deg, transparent 0%, var(--primary-color) 5%, var(--secondary-color) 8%, transparent 12%, transparent 50%, var(--primary-color) 55%, var(--secondary-color) 58%, transparent 62%);
      }

      @keyframes glitch {
        0% {
          text-shadow:
            0 0 2px #fff,
            0 0 10px var(--primary-color);
        }
        20% {
          text-shadow:
            -2px 0 var(--secondary-color),
            2px 2px var(--primary-color);
        }
        40% {
          text-shadow:
            2px -2px var(--secondary-color),
            -2px 2px var(--primary-color);
        }
        60% {
          text-shadow:
            0 0 3px #fff,
            0 0 15px var(--primary-color);
        }
        80% {
          text-shadow:
            2px 0 var(--secondary-color),
            -2px -2px var(--primary-color);
        }
        100% {
          text-shadow:
            0 0 2px #fff,
            0 0 10px var(--primary-color);
        }
      }

      @keyframes rotate {
        from {
          transform: translate(-50%, -50%) rotate(0deg);
        }
        to {
          transform: translate(-50%, -50%) rotate(360deg);
        }
      }

      @keyframes glow {
        0% {
          filter: drop-shadow(0 0 10px #ffff00);
        }
        50% {
          filter: drop-shadow(0 0 1px #ffff00);
        }
        100% {
          filter: drop-shadow(0 0 10px #ffff00);
        }
      }

      @keyframes fadeInPage {
        from {
          opacity: 0;
          transform: scale(0.98);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes popIn {
        from {
          opacity: 0;
          transform: scale(0.5);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
  </head>

  <body>
    <div class="action-bar">
      <div class="line-driver"></div>
      <button title="Home" id="homeBtn"><i class="fa-solid fa-house"></i></button>
      <button title="Gxmes" id="gxmesBtn"><i class="fa-solid fa-gamepad"></i></button>
      <button title="Info" id="infoBtn"><i class="fa-solid fa-address-book"></i></button>
      <button title="Pr0xys" id="proxyBtn"><i class="fa-solid fa-cloud"></i></button>
      <button title="Sound Board" id="soundboardBtn"><i class="fa-solid fa-volume"></i></button>
    </div>
    <canvas id="home-canvas"></canvas>

    <section class="home" id="home-page">
      <h1 class="main-title"><span class="g-circle">G</span>X VERSE</h1>
      <h1 class="sub-title main-title" style="font-size: 1rem; position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%)">Welcome to GX VERSE</h1>
      <div class="search-container">
        <div class="search-box">
          <div class="line-driver"></div>
          <input type="text" id="home-search" autocomplete="off" autofocus autocapitalize="off" autocorrect="off" placeholder="Search gxmes..." spellcheck="false" />
        </div>
      </div>
      <label class="version-label">Ver 0.0.2 BETA</label>
    </section>

    <section class="gxmes" id="gxmes-page" style="display: none; width: 100vw; height: 100vh; flex-direction: column; align-items: center; overflow-y: auto">
      <div class="search-wrapper">
        <div class="search-box">
          <div class="line-driver"></div>
          <input type="text" id="game-search" placeholder="Search gxmes..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
        </div>
      </div>

      <div class="grid" id="game-grid"></div>
    </section>

    <section class="info" id="info-page" style="display: none; width: 100vw; height: 100vh; flex-direction: column; align-items: center; overflow-y: auto; position: relative">
      <iframe id="info-frame" style="width: 100%; height: 100%; border: none"></iframe>
    </section>

    <section class="soundboard" id="soundboard-page" style="display: none; width: 100vw; height: 100vh; flex-direction: column; align-items: center; overflow-y: auto; position: relative">
      <iframe id="soundboard-frame" style="width: 100%; height: 100%; border: none"></iframe>
    </section>

    <div id="game-overlay" class="game-overlay">
      <div id="game-frame-container"></div>

      <div class="game-controls">
        <button id="btn-fullscreen" title="Fullscreen"><i class="fa-solid fa-expand"></i></button>
        <button id="btn-download" title="Download"><i class="fa-solid fa-download"></i></button>
        <button id="btn-exit" title="Exit"><i class="fa-solid fa-xmark"></i></button>
      </div>
    </div>

    <script>
      // Pages, (Intentional Comment)
      const homePage = document.getElementById("home-page");
      const gxmesPage = document.getElementById("gxmes-page");
      const infoPage = document.getElementById("info-page");
      const soundboardPage = document.getElementById("soundboard-page");

      // Buttons, (Intentional Comment)
      const homeBtn = document.getElementById("homeBtn");
      const gxmesBtn = document.getElementById("gxmesBtn");
      const infoBtn = document.getElementById("infoBtn");
      const soundboardBtn = document.getElementById("soundboardBtn");
      const buttons = [homeBtn, gxmesBtn, infoBtn, soundboardBtn];

      // Extra, (Intentional Comment)
      const mainTitle = document.querySelector(".main-title");
      const subTitle = document.querySelector(".sub-title");

      let currentPage = "home";

      const pageMap = {
        home: {page: homePage, btn: homeBtn},
        gxmes: {page: gxmesPage, btn: gxmesBtn},
        info: {page: infoPage, btn: infoBtn},
        soundboard: {page: soundboardPage, btn: soundboardBtn},
      };

      function updateButtons() {
        Object.keys(pageMap).forEach((pageName) => {
          const btn = pageMap[pageName].btn;
          if (pageName === currentPage) {
            btn.disabled = true;
            btn.style.cursor = "pointer";
            btn.style.pointerEvents = "none";
            btn.style.color = "var(--primary-color)";
            btn.style.transform = "translateY(-5px) scale(1.2)";
            btn.style.filter = "drop-shadow(0 0 10px var(--primary-color))";
          } else {
            btn.disabled = false;
            btn.style.cursor = "";
            btn.style.pointerEvents = "";
            btn.style.color = "";
            btn.style.transform = "";
            btn.style.filter = "";
          }
        });
      }

      function switchPage(targetPage) {
        if (targetPage === currentPage) return;

        const prevPage = pageMap[currentPage].page;
        const nextPage = pageMap[targetPage].page;

        prevPage.style.display = "none";
        nextPage.style.display = "flex";
        nextPage.classList.remove("page-fade");
        void nextPage.offsetWidth;
        nextPage.classList.add("page-fade");

        currentPage = targetPage;
        updateButtons();

        if (targetPage === "home") {
          if (mainTitle) {
            mainTitle.style.animation = "none";
            void mainTitle.offsetWidth;
            mainTitle.style.animation = "glitch 2s infinite";
          }
          if (subTitle) {
            subTitle.style.animation = "none";
            void subTitle.offsetWidth;
            subTitle.style.animation = "glitch 2s infinite";
          }
        } else if (targetPage === "gxmes") {
          gameSearch.focus();
        } else if (targetPage === "info") {
        } else if (targetPage === "soundboard") {
        }
      }

      function showDelayedTooltip(btn) {
        btn.classList.add("show-tooltip");
        setTimeout(() => {
          btn.classList.remove("show-tooltip");
        }, 300);
      }

      homeBtn.addEventListener("click", () => {
        showDelayedTooltip(homeBtn);
        switchPage("home");
      });
      gxmesBtn.addEventListener("click", () => {
        showDelayedTooltip(gxmesBtn);
        switchPage("gxmes");
      });
      infoBtn.addEventListener("click", () => {
        showDelayedTooltip(infoBtn);
        switchPage("info");
      });
      soundboardBtn.addEventListener("click", () => {
        showDelayedTooltip(soundboardBtn);
        switchPage("soundboard");
      });

      updateButtons();

      const homeSearch = document.getElementById("home-search");
      const gameSearch = document.getElementById("game-search");

      homeSearch.addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
          gameSearch.value = homeSearch.value;
          gameSearch.dispatchEvent(new Event("input", {bubbles: true}));
          homeSearch.value = "";

    <script>
      const canvas = document.getElementById("home-canvas");
      const ctx = canvas.getContext("2d");

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const constellations = [];
      const constellationCount = 11;
      const starsPerConstellation = 6;

      function createConstellation(cx, cy) {
        const stars = [];
        const connections = [];

        const vx = (Math.random() - 0.5) * 0.2;
        const vy = (Math.random() - 0.5) * 0.2;

        for (let i = 0; i < starsPerConstellation; i++) {
          stars.push({
            ox: (Math.random() - 0.5) * 150,
            oy: (Math.random() - 0.5) * 150,
            twinkle: Math.random() * Math.PI * 5,
          });

          if (i > 0) {
            connections.push([i - 1, i]);
          }
        }

        return {cx, cy, vx, vy, stars, connections};
      }

      for (let i = 0; i < constellationCount; i++) {
        constellations.push(createConstellation(Math.random() * canvas.width, Math.random() * canvas.height));
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        constellations.forEach((c) => {
          c.cx += c.vx;
          c.cy += c.vy;

          if (c.cx < 0 || c.cx > canvas.width) c.vx *= -1;
          if (c.cy < 0 || c.cy > canvas.height) c.vy *= -1;

          c.connections.forEach(([a, b]) => {
            const s1 = c.stars[a];
            const s2 = c.stars[b];

            const x1 = c.cx + s1.ox;
            const y1 = c.cy + s1.oy;
            const x2 = c.cx + s2.ox;
            const y2 = c.cy + s2.oy;

            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.strokeStyle = "rgba(255,255,255, 0.5)";
            ctx.lineWidth = 1;
            ctx.stroke();
          });

          c.stars.forEach((star) => {
            star.twinkle += 0.03;

            const x = c.cx + star.ox;
            const y = c.cy + star.oy;
            const brightness = 0.6 + Math.sin(star.twinkle) * 0.5;

            ctx.beginPath();
            ctx.arc(x, y, 2 + brightness, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255,255,255,${brightness})`;
            ctx.fill();
          });
        });

        requestAnimationFrame(animate);
      }

      animate();
    </script>

      function normalizeForSearch(str) {
        return str.toLowerCase().replace(/[^a-z0-9]/g, "");
      }

      let searchDebounce;
      searchInput.addEventListener("input", (e) => {
        clearTimeout(searchDebounce);
        searchDebounce = setTimeout(() => {
          const term = normalizeForSearch(e.target.value);
          renderGames(gamesList.filter((game) => normalizeForSearch(game.title).includes(term)));
        }, 250);
      });

      searchInput.addEventListener("keypress", (e) => {
        if (!/[a-zA-Z0-9 ]/.test(e.key)) {
          e.preventDefault();
        }
      });

      async function fetchText(url) {
        try {
          const response = await fetch(url);
          return await response.text();
        } catch (err) {
          console.error("Fetch failed:", err);
          return null;
        }
      }

      async function openGameModal(game) {
        currentGame = game;
        overlay.classList.add("active");
        globalActionBar.style.display = "none";
        frameContainer.innerHTML = '<div style="color:white; text-align:center; margin-top:20%; font-family:Orbitron;">LOADING...</div>';

        if (game.code) {
          const fetchedCode = await fetchText(game.code);
          frameContainer.innerHTML = "";

          if (fetchedCode) {
            const iframe = document.createElement("iframe");
            iframe.className = "newtab-iframe";
            iframe.setAttribute("sandbox", "allow-scripts allow-same-origin allow-popups allow-forms");
            iframe.setAttribute("allow", "autoplay; fullscreen; keyboard-events; gamepad");
            iframe.allowFullscreen = true;
            frameContainer.appendChild(iframe);

            const doc = iframe.contentWindow.document;
            doc.open();
            doc.write(fetchedCode);
            doc.close();
          }
        } else if (game.webgl) {
          frameContainer.innerHTML = `
            <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:white; text-align:center; font-family:sans-serif; padding: 20px; width: 100%;">
              <h2 style="margin-bottom: 10px;">WebGL Mode</h2>
              <p style="opacity: 0.8; max-width: 400px; margin-bottom: 20px;">This game requires a new window to run correctly.</p>
              <button onclick="document.getElementById('btn-fullscreen').click()" style="padding: 15px 15px; background: #3066BE; color: white; border: none; border-radius: 100px; cursor: pointer; font-size: 20px; transition: 0.2s;"><i class="fa-solid fa-expand"></i></button>
            </div>
          `;
        } else {
          try {
            const code = await fetchText(game.cdn);
            frameContainer.innerHTML = "";
            const iframe = document.createElement("iframe");
            iframe.className = "newtab-iframe";
            iframe.setAttribute("allow", "autoplay; fullscreen; keyboard-events; gamepad");
            iframe.allowFullscreen = true;
            const blob = new Blob([code], {type: "text/html"});
            iframe.src = URL.createObjectURL(blob);
            frameContainer.appendChild(iframe);
          } catch (error) {
            console.error("Load error:", error);
          }
        }
      }

      document.getElementById("btn-exit").addEventListener("click", () => {
        overlay.classList.remove("active");
        frameContainer.innerHTML = "";
        globalActionBar.style.display = "flex";
        currentGame = null;
      });

      document.getElementById("btn-fullscreen").addEventListener("click", async () => {
        if (!currentGame) return;

        const targetUrl = currentGame.code || currentGame.cdn;
        const fetchedContent = await fetchText(targetUrl);

        if (fetchedContent) {
          const newWin = window.open("about:blank", "_blank");
          if (newWin) {
            newWin.document.open();
            newWin.document.write(fetchedContent);
            newWin.document.close();

            setTimeout(function () {
              const docEl = newWin.document.documentElement;
              const requestFs = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullscreen || docEl.msRequestFullscreen;
              if (requestFs) requestFs.call(docEl);
            }, 500);
          } else {
            alert("Popup blocked! Please allow popups to launch the game.");
          }
        }
      });

      document.getElementById("btn-download").addEventListener("click", async () => {
        if (!currentGame) return;

        const targetUrl = currentGame.code || currentGame.cdn;
        const fetchedContent = await fetchText(targetUrl);

        if (fetchedContent) {
          const fileName = currentGame.title.replace(/\s+/g, "_") + ".html";
          const blob = new Blob([fetchedContent], {type: "text/html"});
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = fileName;
          a.click();
          window.URL.revokeObjectURL(url);
        }
      });
      renderGames(gamesList);

          soundboardFrame.src = blobUrl;
        } catch (error) {
          console.error("Error loading soundboard page:", error);
          soundboardFrame.srcdoc = "<p style='color:white;text-align:center;'>Failed to load content my very HARDEST THING FOR SOME REASON TS TOOK LIKE 2 HOURS. So if this fails I crash out 30 times</p>";
        }
      }
      
      window.onload = () => {
        loadInfoPage();
        loadSoundboard();
      }
    </script>
  </body>
