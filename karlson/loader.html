<!doctype html>
<html lang="en-us">
  <head>
    <base href="https://cdn.jsdelivr.net/gh/genizy/web-port@main/karlson/" />
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Karlson | GX Port</title>
    <script src="Build/UnityLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    
    <style>
      :root { --primary-color: #0000ff; --secondary-color: #00fff7; }
      * { margin: 0; padding: 0; border: 0; overflow: hidden; }
      body { background: #000; position: fixed; width: 100%; height: 100%; font-family: 'Segoe UI', sans-serif; }
      
      #unityContainer { position: absolute; width: 100%; height: 100%; z-index: 1; }

      #loader-overlay {
        position: fixed;
        inset: 0;
        background: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 100;
        transition: opacity 0.8s ease;
      }

      .progress-box { width: 500px; text-align: center; color: white; }
      
      #msg { letter-spacing: 3px; font-weight: bold; text-transform: uppercase; margin-bottom: 20px; font-size: 14px; }

      .bar-container {
        position: relative;
        height: 30px;
        background: #111;
        border-radius: 50px;
        padding: 3px;
        display: flex;
        align-items: center;
        overflow: hidden;
      }

      .glow-line {
        position: absolute;
        inset: 0;
        border-radius: 50px;
        padding: 2px;
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        mask-composite: exclude;
      }

      .glow-line::before {
        content: "";
        position: absolute;
        width: 200%;
        height: 200%;
        top: -50%;
        left: -50%;
        background: conic-gradient(from 0deg, transparent, var(--primary-color), var(--secondary-color), transparent);
        animation: rotate 2s linear infinite;
      }

      #bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
        border-radius: 50px;
        box-shadow: 0 0 15px var(--primary-color);
        transition: width 5s linear; 
      }

      #percent { margin-top: 12px; opacity: 0.5; font-size: 12px; }
      @keyframes rotate { to { transform: rotate(360deg); } }
    </style>

    <script>
      function resizeUnityContainer() {
        var container = document.getElementById("unityContainer");
        container.style.width = window.innerWidth + "px";
        container.style.height = window.innerHeight + "px";
      }

      async function loadZip(url) {
        const response = await fetch(url);
        const arrayBuffer = await response.arrayBuffer();
        const zip = await new JSZip().loadAsync(arrayBuffer);
        const content = await zip.file("tyj.wasm.code.unityweb").async("blob");
        return URL.createObjectURL(content);
      }

      async function startUnity() {
        const bar = document.getElementById('bar');
        const pct = document.getElementById('percent');
        const loader = document.getElementById('loader-overlay');

        setTimeout(() => { 
            bar.style.width = "100%"; 
            let count = 0;
            let interval = setInterval(() => {
                count++;
                pct.innerText = count + "%";
                if(count >= 100) clearInterval(interval);
            }, 50); 
        }, 100);

        try {
          const wasmurl = await loadZip("Build/tyj.wasm.code.unityweb.zip");
          
          const json = {
            dataUrl: "Build/tyj.data.unityweb",
            wasmCodeUrl: wasmurl,
            wasmFrameworkUrl: "Build/tyj.wasm.framework.js",
            graphicsAPI: ["WebGL 2.0"],
            backgroundColor: "#231F20",
          };

          UnityLoader.instantiate("unityContainer", json, {
            Module: {
              onRuntimeInitialized: function () {
                resizeUnityContainer();
                loader.style.opacity = "0";
                setTimeout(() => loader.remove(), 800);
              },
            },
          });
        } catch (e) {
          console.error(e);
        }
      }

      window.addEventListener("resize", resizeUnityContainer);
      window.addEventListener("load", startUnity);
    </script>
  </head>
  <body>
    <div id="loader-overlay">
      <div class="progress-box">
          <div id="msg">Booting Karlson.exe</div>
          <div class="bar-container">
              <div class="glow-line"></div>
              <div id="bar"></div>
          </div>
          <div id="percent">0%</div>
      </div>
    </div>
    <div id="unityContainer"></div>
  </body>
</html>
