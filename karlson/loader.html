<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Karlson</title>

    <script src="https://cdn.jsdelivr.net/gh/genizy/web-port@main/karlson/Build/UnityLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

    <style>
        :root {
            --primary-color: #0000ff;
            --secondary-color: #00fff7;
        }

        html, body {
            margin: 0; padding: 0; overflow: hidden;
            height: 100%; width: 100%; background: #000;
            font-family: 'Segoe UI', sans-serif;
            display: flex; align-items: center; justify-content: center;
        }

        #unityContainer {
            width: 100vw !important; height: 100vh !important;
            position: fixed; top: 0; left: 0;
        }

        #loader {
            position: relative; width: 520px; text-align: center;
            color: white; z-index: 100; transition: opacity 0.8s ease, transform 0.8s ease;
        }

        #loading-text {
            margin-bottom: 20px; font-size: 18px;
            letter-spacing: 2px; text-transform: uppercase;
        }

        .progress-container {
            position: relative; width: 100%; height: 30px;
            background: #000; border-radius: 50px;
            display: flex; align-items: center; justify-content: center;
            padding: 4px; overflow: hidden;
        }

        .line-driver {
            position: absolute; inset: 0; border-radius: 50px;
            z-index: 0; overflow: hidden;
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude; padding: 2px;
        }

        .line-driver::before {
            content: ""; position: absolute; width: 4000px; height: 4000px;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: conic-gradient(from 0deg, transparent 0%, var(--primary-color) 20%, var(--secondary-color) 40%, transparent 50%);
            animation: rotate 2s linear infinite;
            filter: drop-shadow(0 0 10px var(--primary-color));
        }

        @keyframes rotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        #progress-bar-bg {
            width: 100%; height: 100%; background: rgba(255, 255, 255, 0.05);
            border-radius: 50px; overflow: hidden; z-index: 1;
        }

        #progress-bar {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            box-shadow: 0 0 15px var(--primary-color); transition: width 0.3s ease;
        }

        #percent { margin-top: 12px; font-size: 12px; letter-spacing: 1px; opacity: 0.6; }
    </style>
</head>

<body>
    <div id="loader">
        <div id="loading-text">Initializing Karlson</div>
        <div class="progress-container">
            <div class="line-driver"></div>
            <div id="progress-bar-bg">
                <div id="progress-bar"></div>
            </div>
        </div>
        <div id="percent">0%</div>
    </div>

    <div id="unityContainer"></div>

    <script>
        const progressBar = document.querySelector("#progress-bar");
        const percentText = document.querySelector("#percent");
        const loadingLabel = document.querySelector("#loading-text");
        const loaderUI = document.querySelector("#loader");

        function updateProgress(val) {
            let percent = Math.min(Math.floor(val * 100), 100);
            progressBar.style.width = percent + "%";
            percentText.textContent = percent + "%";
        }

        async function loadZip(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Zip failed to load: ${response.status}`);
            const arrayBuffer = await response.arrayBuffer();
            const zip = await JSZip.loadAsync(arrayBuffer);
            const wasmFile = zip.file("tyj.wasm.code.unityweb");
            if (wasmFile) {
                const content = await wasmFile.async("blob");
                return URL.createObjectURL(content);
            }
            throw new Error("WASM file not found in zip");
        }

        async function startUnity() {
            try {
                const buildPath = "https://cdn.jsdelivr.net/gh/genizy/web-port@main/karlson/Build";
                const rootPath = "https://cdn.jsdelivr.net/gh/genizy/web-port@main/karlson/Build";

                updateProgress(0.1);
                const wasmurl = await loadZip(`${buildPath}/tyj.wasm.code.unityweb.zip`);
                
                loadingLabel.textContent = "Loading Game Data";
                updateProgress(0.4);

                const config = {
                    companyName: "Dani",
                    productName: "Karlson",
                    productVersion: "0.1",
                    dataUrl: `${rootPath}/tyj.data.unityweb`,
                    wasmCodeUrl: wasmurl,
                    wasmFrameworkUrl: `${rootPath}/tyj.wasm.framework.js`,
                    graphicsAPI: ["WebGL 2.0"],
                    backgroundColor: "#231F20",
                    unityVersion: "2019.2.6f1"
                };

                UnityLoader.instantiate("unityContainer", config, {
                    onProgress: (inst, prog) => {
                        updateProgress(0.4 + (prog * 0.6));
                    },
                    Module: {
                        onRuntimeInitialized: function () {
                            updateProgress(1);
                            loaderUI.style.opacity = "0";
                            setTimeout(() => loaderUI.remove(), 800);
                        }
                    }
                });
            } catch (err) {
                loadingLabel.textContent = "Loading Failed";
                console.error("Karlson Port Error:", err);
            }
        }

        window.addEventListener("load", startUnity);
    </script>
</body>
</html>
