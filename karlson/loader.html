<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity WebGL Player | Karlson</title>

  <!-- Unity Loader -->
  <script src="https://cdn.jsdelivr.net/gh/genizy/web-port@main/karlson/Build/UnityLoader.js"></script>

  <!-- JSZip -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      border: 0;
      overflow: hidden;
    }

    body {
      background: #000;
      position: fixed;
      width: 100%;
      height: 100%;
    }

    #unityContainer {
      position: absolute;
      width: 100%;
      height: 100%;
    }

    #sidebarad1, #sidebarad2 {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 160px;
      height: 600px;
      z-index: 999999;
    }

    #sidebarad1 { left: 0; }
    #sidebarad2 { right: 0; }

    .sidebar-close {
      position: absolute;
      top: 0;
      right: 0;
      width: 22px;
      height: 22px;
      line-height: 22px;
      text-align: center;
      background: rgba(0,0,0,0.7);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
  </style>

  <script>
    function resizeUnityContainer() {
      const container = document.getElementById("unityContainer");
      container.style.width = window.innerWidth + "px";
      container.style.height = window.innerHeight + "px";
    }

    async function loadZip(url) {
      const response = await fetch(url);
      const arrayBuffer = await response.arrayBuffer();

      const zip = await JSZip.loadAsync(arrayBuffer);

      if (zip.files["tyj.wasm.code.unityweb"]) {
        const content = await zip.file("tyj.wasm.code.unityweb").async("blob");
        return URL.createObjectURL(content);
      }

      throw new Error("WASM file not found in zip");
    }

    async function startUnity() {
      const wasmurl = await loadZip("https://cdn.jsdelivr.net/gh/genizy/web-port@main/karlson/Build/tyj.wasm.code.unityweb.zip");

      const config = {
        companyName: "Dani",
        productName: "Karlson",
        productVersion: "0.1",
        dataUrl: "https://cdn.jsdelivr.net/gh/genizy/web-port@main/karlson/tyj.data.unityweb",
        wasmCodeUrl: wasmurl,
        wasmFrameworkUrl: "https://cdn.jsdelivr.net/gh/genizy/web-port@main/karlson/tyj.wasm.framework.js",
        graphicsAPI: ["WebGL 2.0"],
        webglContextAttributes: { preserveDrawingBuffer: false },
        splashScreenStyle: "Dark",
        backgroundColor: "#231F20",
        developmentBuild: false,
        multithreading: false,
        unityVersion: "2019.2.6f1"
      };

      window.addEventListener("resize", resizeUnityContainer);

      UnityLoader.instantiate("unityContainer", config, {
        Module: {
          onRuntimeInitialized: function () {
            resizeUnityContainer();
            const loading = document.getElementById("loading-text");
            if (loading) loading.remove();
          }
        }
      });
    }

    window.addEventListener("load", startUnity);
  </script>
</head>

<body>
  <div id="loading-text" style="color:white;font-size:48px;font-family:cursive;text-align:center;margin-top:20px;">
    LOADING...
  </div>

  <div id="unityContainer"></div>
</body>
</html>
