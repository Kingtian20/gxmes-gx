<!DOCTYPE html>
<html lang="en">
 
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" /> 
    <base href="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@23edae6437a2cded4027d5c487fc9f6362e3ebfd/bacon%20may%20die/">
    <meta http-equiv="pragma" content="no-cache" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta charset="utf-8" />

    <title>Bacon May Die by SnoutUp </title>
    <meta name="robots" content="noindex,nofollow" />
    <script src="poki-sdk.js"></script>
    <script></script>

    <script>
        var adsAreDisabled = true;
    </script>
    <script src="html5game/prebid/ads.js"></script>
    <style>
        :root {
            --primary-color: #0000ff;
            --secondary-color: #00fff7;
        }

        html {
            height: 100%;
            width: 100%;
        }

        body {
            color: #cccccc;
            margin: 0px;
            padding: 0px;
            border: 0px;
            overflow: hidden;
            height: 100%;
            background-color: #000;
            background-image: url('html5game/bg.jpg');
            background-repeat: repeat-x;
            background-position: center center;
            background-size: 0 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
        }

        /* Full Black Background Loader Overlay */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        #loading-text {
            color: white;
            margin-bottom: 20px;
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .progress-container {
            position: relative;
            width: 320px;
            height: 30px;
            background: #111;
            border-radius: 50px;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .line-driver {
            position: absolute;
            inset: 0;
            border-radius: 50px;
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            padding: 2px;
        }

        .line-driver::before {
            content: "";
            position: absolute;
            width: 400px;
            height: 400px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: conic-gradient(from 0deg, transparent 0%, var(--primary-color) 10%, var(--secondary-color) 20%, transparent 25%);
            animation: rotate 2s linear infinite;
        }

        @keyframes rotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        #fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            box-shadow: 0 0 15px var(--primary-color);
            border-radius: 50px;
            transition: width 0.1s linear;
        }

        #percent {
            color: white;
            margin-top: 12px;
            font-size: 12px;
            letter-spacing: 1px;
            opacity: 0.6;
        }

        img#spider {
            display: none;
        }

        img.torch {
            position: fixed;
            height: 128px;
            width: 128px;
            top: 30%;
            background: url('html5game/tbg.png') 50% 50% no-repeat;
            background-size: 128px;
            opacity: 0.3;
        }

        #t1 { left: 20%; }
        #t2 { right: 20%; }

        img#door {
            position: fixed;
            top: 35%;
            left: 0;
            right: 0;
            margin: 0 auto;
            z-index: 10;
            display: none;
        }

        canvas {
            image-rendering: optimizeSpeed;
            -webkit-interpolation-mode: nearest-neighbor;
            -ms-touch-action: none;
            margin: 0px;
            padding: 0px;
            border: 0px;
            display: none;
        }

        #canvas,
        canvas {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        div.gm4html5_div_class {
            margin: 0px;
            padding: 0px;
            border: 0px;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body id="body90">
    <div class="gm4html5_div_class" id="gm4html5_div_id">
        <canvas id="canvas" width="1024" height="576">
            <p>Your browser doesn't support HTML5 canvas.</p>
        </canvas>
        <script type="text/javascript" src="html5game/BaconMayDie.js"></script>
    </div>

    <div id="loader">
        <div id="loading-text">Merging Assets</div>
        <div class="progress-container">
            <div class="line-driver"></div>
            <div id="progress-bar-bg" style="width:100%; height:100%; overflow:hidden; border-radius:50px;">
                <div id="fill"></div>
            </div>
        </div>
        <div id="percent">0%</div>
    </div>

    <div id="decor">
        <img class="torch" id="t1" src="html5game/torch.gif" alt=""/>
        <img class="torch" id="t2" src="html5game/torch.gif" alt=""/>
        <img id="door" alt="" src="html5game/door.png"/>
    </div>

    <script>
        var sdk         = PokiSDK;
        var pokiDebug   = false;
        var canvas      = document.getElementById("canvas");
        var body        = document.getElementById("body90");
        var loader      = document.getElementById("loader");
        var fill        = document.getElementById("fill");
        var percentText = document.getElementById("percent");
        var decor       = document.getElementById("decor");     

        var fakeCent        = 1;    
        var fakeCentTarget  = 75;
        var fails           = 0;
        
        function poki_log(t) { console.log(t); }
        function poki_debug() { return pokiDebug; }
        
        function poki_loading(progress) {
            fakeCentTarget = Math.max(fakeCentTarget, progress * 100);
            sdk.gameLoadingProgress({percentageDone: progress * 0.9});
            
            if (progress == 1) {
                setTimeout(function () {
                    clearInterval(fakeLoading);
                    
                    loader.style.opacity = "0";
                    loader.style.transform = "translateY(-20px)";
                    
                    setTimeout(() => {
                        loader.remove();
                        decor.style.display     = "none";
                        canvas.style.display    = "block";
                        window.focus();
                    }, 1600);
                }, 2000);
            }
        }
        
        function bar_update(progress) {
            progress = Math.floor(Math.max(fakeCent, progress));
            fill.style.width = progress + "%";
            percentText.textContent = progress + "%";
        }
        
        var fakeLoading = setInterval(function() {
                fakeCent = loading_lerp(fakeCent, fakeCentTarget, 0.05);
                bar_update(fakeCent);                           
        }, 20);     
        
        function gamemaker_start() {
            try {
              GameMaker_Init();
            } catch(err) {
                fails++;            
                setTimeout(gamemaker_start, 5000);
                if (fails == 1) throw(err);                     
            }
        }

        var bgScale = window.innerHeight / 1024;
        body.style.backgroundSize = (512 * bgScale) + "px " + (1024 * bgScale) + "px";
        
        window.onload = function() {
            sdk.init().then(() => {
                setTimeout(gamemaker_start, adsAreDisabled ? 5000 : 1);
                sdk.setDebug(pokiDebug);   
                sdk.gameLoadingStart();     
            }).catch(() => {
                gamemaker_start();
            });
        
            canvas.width  = window.innerWidth;
            canvas.height = window.innerHeight;
            canvas.addEventListener('click', function(){
                window.focus();
            });           
        }
        
        window.addEventListener('wheel', ev => ev.preventDefault(), { passive: false });
        window.addEventListener('keydown', ev => {
            if (['ArrowDown', 'ArrowUp', ' '].includes(ev.key)) {
                ev.preventDefault();
            }
        });     
            
        function loading_lerp (start, end, amt){
            return (1 - amt) * start + amt * end;
        }
    </script>
</body>
</html>
