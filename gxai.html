    <script>
      // ── State ──────────────────────────────────────────────────────────────────────
      var SERVER = "` + server + `";
      var WS_URL = SERVER.replace(/^https/, "wss").replace(/^http(?!s)/, "ws") + "/ws";
      var token = null,
        currentUser = null,
        conversations = [],
        currentConvId = null;
      var isStreaming = false,
        pendingImageDataUrl = null,
        authTab = "login";

      // ── Helpers ───────────────────────────────────────────────────────────────────
      function qs(id) {
        return document.getElementById(id);
      }
      function escHtml(s) {
        return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }
      function uid() {
        return Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
      }

      // ── WebSocket client ───────────────────────────────────────────────────────────
      var _ws = null,
        _wsReady = false,
        _wsRetries = 0,
        _pending = {},
        _sendBuf = [];

      function wsSend(obj) {
        var str = JSON.stringify(obj);
        if (_ws && _ws.readyState === 1 /*OPEN*/) {
          _ws.send(str);
        } else {
          _sendBuf.push(str);
        }
      }

      function _flushBuf() {
        var buf = _sendBuf;
        _sendBuf = [];
        for (var i = 0; i < buf.length; i++) {
          if (_ws && _ws.readyState === 1) _ws.send(buf[i]);
        }
      }

      // Send a message and await a single response keyed by requestId
      function wsCall(type, payload) {
        return new Promise(function (resolve, reject) {
          var rid = uid();
          var timer = setTimeout(function () {
            delete _pending[rid];
            reject(new Error("request timed out"));
          }, 15000);
          _pending[rid] = {
            resolve: function (data) {
              clearTimeout(timer);
              delete _pending[rid];
              resolve(data);
            },
            reject: function (err) {
              clearTimeout(timer);
              delete _pending[rid];
              reject(err);
            },
          };
          wsSend(Object.assign({}, payload, {type: type, requestId: rid}));
        });
      }

      function wsStream(type, payload, onChunk) {
        return new Promise(function (resolve, reject) {
          var rid = uid();
          var timer = setTimeout(function () {
            delete _pending[rid];
            reject(new Error("stream timed out"));
          }, 120000);
          _pending[rid] = {
            isStream: true,
            onChunk: onChunk,
            resolve: function (data) {
              clearTimeout(timer);
              delete _pending[rid];
              resolve(data);
            },
            reject: function (err) {
              clearTimeout(timer);
              delete _pending[rid];
              reject(err);
            },
          };
          wsSend(Object.assign({}, payload, {type: type, requestId: rid}));
        });
      }

      function _handleWsMessage(msg) {
        var p = msg.requestId && _pending[msg.requestId];
        if (!p) return;
        if (msg.error) {
          p.reject(new Error(msg.error));
          return;
        }
        if (p.isStream) {
          if (msg.type === "chunk") {
            p.onChunk(msg.content);
            return;
          }
          if (msg.type === "done") {
            p.resolve({model: msg.model});
            return;
          }
          if (msg.type === "model") {
            return;
          } // ignore interim model announcement
        } else {
          p.resolve(msg.data !== undefined ? msg.data : null);
        }
      }

      function _connectWs(onReady) {
        try {
          _ws = new WebSocket(WS_URL);
        } catch (e) {
          _wsRetries++;
          setTimeout(
            function () {
              _connectWs(onReady);
            },
            Math.min(3000, 500 * _wsRetries),
          );
          return;
        }
        _ws.onopen = function () {
          _wsReady = true;
          _wsRetries = 0;
          _flushBuf();
          var s = document.getElementById("ws-status");
          if (s) s.textContent = "connected";
          // keepalive ping every 25s so autoscale load balancer doesn't drop idle connections
          var pingId = setInterval(function () {
            if (_ws && _ws.readyState === 1) _ws.send(JSON.stringify({type: "ping"}));
            else clearInterval(pingId);
          }, 25000);
          _ws._pingId = pingId;
          if (onReady) {
            onReady();
            onReady = null;
          }
        };
        _ws.onmessage = function (ev) {
          var msg;
          try {
            msg = JSON.parse(ev.data);
          } catch (e) {
            return;
          }
          _handleWsMessage(msg);
        };
        _ws.onclose = function () {
          _wsReady = false;
          var s = document.getElementById("ws-status");
          if (s) s.textContent = "disconnected — reconnecting...";
          for (var rid in _pending) {
            _pending[rid].reject(new Error("disconnected"));
          }
          _pending = {};
          _wsRetries++;
          setTimeout(
            function () {
              _connectWs(null);
            },
            Math.min(5000, 500 * _wsRetries),
          );
        };
        _ws.onerror = function () {
          var s = document.getElementById("ws-status");
          if (s) s.textContent = "connection error — retrying...";
        };
      }

      // Boot: connect WS, then restore session or show auth
      _connectWs(function () {
        (async function () {
          try {
            var savedToken = localStorage.getItem("zyrx_token");
            if (savedToken) {
              var user = await wsCall("auth/me", {token: savedToken});
              token = savedToken;
              currentUser = user;
              showApp();
              return;
            }
          } catch (e) {
            localStorage.removeItem("zyrx_token");
          }
          // Show auth form — WS is ready so it will work
        })();

      // ── Auth ──────────────────────────────────────────────────────────────────────
      document.getElementById("tab-login").onclick = function () {
        switchTab("login");
      };
      document.getElementById("tab-register").onclick = function () {
        switchTab("register");

      function switchTab(tab) {
        authTab = tab;
        document.getElementById("tab-login").className = "tab-btn" + (tab === "login" ? " active" : "");
        document.getElementById("tab-register").className = "tab-btn" + (tab === "register" ? " active" : "");
        qs("auth-submit").innerHTML = tab === "login" ? '<i class="fa-solid fa-arrow-right-to-bracket"></i>&nbsp; Sign In' : '<i class="fa-solid fa-user-plus"></i>&nbsp; Create Account';
        qs("auth-error").textContent = "";
      }

      qs("auth-submit").onclick = doAuth;
      qs("auth-password").onkeydown = function (e) {
        if (e.key === "Enter") doAuth();
      };
      qs("auth-username").onkeydown = function (e) {
        if (e.key === "Enter") qs("auth-password").focus();

      async function doAuth() {
        var username = qs("auth-username").value.trim(),
          password = qs("auth-password").value;
        qs("auth-error").textContent = "";
        if (!username || !password) {
          qs("auth-error").textContent = "please fill in all fields";

        if (!_wsReady) {
          qs("auth-error").textContent = "connecting to server... please wait a moment and try again";
          return;
        }
        qs("auth-submit").disabled = true;
        try {
          var wsType = authTab === "login" ? "auth/login" : "auth/register";
          var data = await wsCall(wsType, {username: username, password: password});
          token = data.apiToken;

          try {
            localStorage.setItem("zyrx_token", token);
          } catch (e) {}
          showApp();
        } catch (e) {
          qs("auth-error").textContent = e.message || "could not connect to server";
        } finally {
          qs("auth-submit").disabled = false;
        }
      }

      async function showApp() {
        qs("auth-screen").style.display = "none";
        qs("app").className = "visible";
        qs("user-label").textContent = currentUser.username;
        await loadConversations();
      }

      qs("logout-btn").onclick = function () {
        try {
          localStorage.removeItem("zyrx_token");
        } catch (e) {}
        token = null;
        currentUser = null;
        conversations = [];
        currentConvId = null;
        qs("app").className = "";
        qs("auth-screen").style.display = "flex";
        qs("auth-username").value = "";
        qs("auth-password").value = "";
      };

      // ── Conversations ─────────────────────────────────────────────────────────────
      var EMPTY_STATE =
        '<div id="empty-state"><div class="empty-icon"><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg></div><div><div class="empty-title">How can I help you today?</div><div class="empty-sub">Send a message to start the conversation.</div></div></div>';

      async function loadConversations() {
        try {
          conversations = await wsCall("listConversations", {token: token});
          renderConvList();
        } catch (e) {}
      }

      function fmtDate(d) {
        var dt = new Date(d);
        var mo = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][dt.getMonth()];
        var hr = dt.getHours();
        var mi = dt.getMinutes();
        var ap = hr >= 12 ? "pm" : "am";
        hr = hr % 12 || 12;
        mi = (mi < 10 ? "0" : "") + mi;
        return mo + " " + dt.getDate() + ", " + hr + ":" + mi + " " + ap;
      }

      function renderConvList() {
        var list = qs("conv-list");
        list.innerHTML = '<div class="conv-section-label">Recent</div>';
        if (!conversations.length) {
          list.innerHTML += '<div style="padding:8px 12px;color:var(--muted);font-size:13px;font-style:italic">No conversations yet.</div>';
          return;
        }
        conversations.forEach(function (c) {
          var div = document.createElement("div");
          div.className = "conv-item" + (c.id === currentConvId ? " active" : "");
          var trash =
            '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>';
          var ts = c.createdAt ? fmtDate(c.createdAt) : "";
          div.innerHTML =
            '<div class="conv-info"><div class="conv-title">' +
            escHtml(c.title || "Untitled Chat") +
            "</div>" +
            (ts ? '<div class="conv-time">' + ts + "</div>" : "") +
            '</div><button class="conv-delete" title="Delete">' +
            trash +
            "</button>";
          div.querySelector(".conv-delete").onclick = function (e) {
            e.stopPropagation();
            deleteConv(c.id);
          };
          div.onclick = function () {
            selectConv(c.id);
          };
          list.appendChild(div);
        });
      }

      async function selectConv(id) {
        currentConvId = id;
        renderConvList();
        qs("messages-inner").innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:80vh;color:var(--muted);font-size:13px">Loading...</div>';
        try {
          var conv = await wsCall("getConversation", {token: token, id: id});
          renderMessages(conv.messages || []);
        } catch (e) {}
      }

      var SPARKLES_SVG =

      function normalizeMath(text) {
        var bs = String.fromCharCode(92);
        var tick = String.fromCharCode(96);
        var result = "";
        var i = 0;

        while (i < text.length) {
          // Code blocks (backticks) - always protect from markdown
          if (text[i] === tick) {
            var n = 1;
            while (text[i + n] === tick) n++;
            var end = text.indexOf(tick.repeat(n), i + n);
            if (end >= 0) {
              result += text.slice(i, end + n);
              i = end + n;
              continue;
            }
          }

          // Complete $$...$$ blocks - leave for KaTeX
          if (text[i] === "$" && text[i + 1] === "$") {
            var end = text.indexOf("$$", i + 2);
            if (end >= 0) {
              result += text.slice(i, end + 2);
              i = end + 2;
              continue;
            } else {
              // Incomplete $$ - escape it
              result += "&#36;&#36;" + text.slice(i + 2);
              break;
            }
          }

          // Convert complete \[...\] to $$...$$
          if (text[i] === bs && text[i + 1] === "[") {
            var end = text.indexOf(bs + "]", i + 2);
            if (end >= 0) {
              result += "$$" + text.slice(i + 2, end) + "$$";
              i = end + 2;
              continue;
            } else {
              // Incomplete \[ - escape it
              result += bs + "[" + text.slice(i + 2);
              break;
            }
          }

          // Convert complete \(...\) to $...$
          if (text[i] === bs && text[i + 1] === "(") {
            var end = text.indexOf(bs + ")", i + 2);
            if (end >= 0) {
              result += "$" + text.slice(i + 2, end) + "$";
              i = end + 2;
              continue;
            } else {
              // Incomplete \( - escape it
              result += bs + "(" + text.slice(i + 2);
              break;
            }
          }

          // Complete $...$ inline math - leave for KaTeX
          if (text[i] === "$" && text[i + 1] !== "$") {
            var end = text.indexOf("$", i + 1);
            if (end >= 0) {
              result += text.slice(i, end + 1);
              i = end + 1;
              continue;
            } else {
              // Incomplete $ - escape it
              result += "&#36;" + text.slice(i + 1);
              break;
            }
          }

          result += text[i++];
        }

        return result;

          ctx.beginPath();

          ctx.lineTo(s.x - Math.cos(s.angle) * s.length, s.y - Math.sin(s.angle) * s.length);
          ctx.strokeStyle = grad;
          ctx.lineWidth = 2;
          ctx.stroke();

          s.x += Math.cos(s.angle) * s.speed;
          s.y += Math.sin(s.angle) * s.speed;
          s.opacity -= 0.01;

          return true;

        requestAnimationFrame(draw);

      resize();
