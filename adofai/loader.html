<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Title</title>
        <meta name="viewport" content="width=device-width, initial-scale=2.0" />
    </head>
    <body>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/gh/paigerodeghero/academicwebsite@897c910c65e6c68b04c44a6b6eba0b99d0f2f2cf/TemplateData/style.css" />

        <script src="https://cdn.jsdelivr.net/gh/paigerodeghero/academicwebsite@897c910c65e6c68b04c44a6b6eba0b99d0f2f2cf/TemplateData/UnityProgress.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/udbsite/adofai@f170efcb1b532312817e69f26ce3f84c99940238/Build/UnityLoader.js"></script>

        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                transform: scale(1.3);
                transform-origin: center center;
            }

            .webgl-content {
                position: fixed;
                top: 0;
                left: 50%;
                transform: translateX(-50%);
                width: 100%;
                height: 100%;
            }

            #gameContainer {
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                background-color: #000;
                justify-content: center;
            }

            #canvas {
                width: 100vw;
                height: 100vh;
                background-color: #000;
            }
        </style>

        <div class="webgl-content">
            <div id="gameContainer"></div>
        </div>

        <script>
            function resizeCanvas() {
                var canvas = document.getElementById("canvas");
                if (canvas) {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                    canvas.style.width = "100vw";
                    canvas.style.height = "100vh";
                }
            }
            window.addEventListener("resize", resizeCanvas);

            function resizeLoop() {
                resizeCanvas();
                requestAnimationFrame(resizeLoop);
            }
            resizeLoop();

            var gameInstance = UnityLoader.instantiate(
                "gameContainer",
                "https://cdn.jsdelivr.net/gh/udbsite/adofai@f170efcb1b532312817e69f26ce3f84c99940238/Build/adofaiii4.json",
                {
                    onProgress: UnityProgress,
                    Module: {
                        onRuntimeInitialized: function () {
                            UnityProgress(gameInstance, "complete");
                            resizeCanvas();
                        }
                    }
                }
            );
        </script>
    </body>
</html>
