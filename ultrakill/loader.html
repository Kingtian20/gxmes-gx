<!DOCTYPE html>
<html lang="en-us">
<head>
    <base href="https://cdn.jsdelivr.net/gh/Kingtian20/gxmes-gx@latest/ultrakill/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>ULTRAKILL</title>
    <style>
        :root {
            --primary-color: #0000ff;
            --secondary-color: #00fff7;
        }

        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            width: 100%;
            background: black;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #unity-canvas {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }

        #loader {
            position: relative;
            width: 520px;
            text-align: center;
            color: white;
            z-index: 10;
        }

        #loading-text {
            margin-bottom: 20px;
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .progress-container {
            position: relative;
            width: 100%;
            height: 30px;
            background: #000;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            overflow: hidden;
        }

        .line-driver {
            position: absolute;
            inset: 0;
            border-radius: 50px;
            z-index: 0;
            overflow: hidden;
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            padding: 2px;
        }

        .line-driver::before {
            content: "";
            position: absolute;
            width: 4000px;
            height: 4000px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: conic-gradient(from 0deg, transparent 0%, var(--primary-color) 20%, var(--secondary-color) 40%, transparent 50%);
            animation: rotate 2s linear infinite;
            filter: drop-shadow(0 0 10px var(--primary-color));
        }

        @keyframes rotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        #progress-bar-bg {
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50px;
            overflow: hidden;
            z-index: 1;
        }

        #progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            box-shadow: 0 0 15px var(--primary-color);
            transition: width 0.3s ease;
        }

        #percent {
            margin-top: 12px;
            font-size: 12px;
            letter-spacing: 1px;
            opacity: 0.6;
        }
    </style>
</head>

<body>
    <div id="loader">
        <div id="loading-text">Merging Assets</div>
        
        <div class="progress-container">
            <div class="line-driver"></div>
            <div id="progress-bar-bg">
                <div id="progress-bar"></div>
            </div>
        </div>

        <div id="percent">0%</div>
    </div>

    <canvas id="unity-canvas" tabindex="-1" hidden></canvas>

    <script src="Build/ultrakill.loader.js"></script>
    <script>
        const progressBar = document.querySelector("#progress-bar");
        const percentText = document.querySelector("#percent");
        const canvas = document.querySelector("#unity-canvas");

        function updateProgress(value) {
            let percent = Math.min(Math.floor(value * 100), 100);
            progressBar.style.width = percent + "%";
            percentText.textContent = percent + "%";
        }

        function mergeFiles(fileParts, progressWeight, offset) {
            return new Promise((resolve, reject) => {
                let buffers = [];
                let loaded = 0;
                function fetchPart(index) {
                    if (index >= fileParts.length) {
                        resolve(URL.createObjectURL(new Blob(buffers)));
                        return;
                    }
                    fetch(fileParts[index])
                        .then(res => res.arrayBuffer())
                        .then(data => {
                            buffers.push(data);
                            loaded++;
                            updateProgress(offset + (loaded / fileParts.length) * progressWeight);
                            fetchPart(index + 1);
                        })
                        .catch(reject);
                }
                fetchPart(0);
            });
        }

        function getParts(file, start, end) {
            let parts = [];
            for (let i = start; i <= end; i++) { parts.push(file + ".part" + i); }
            return parts;
        }

        Promise.all([
            mergeFiles(getParts("Build/ultrakill.data.unityweb", 1, 4), 0.4, 0),
            mergeFiles(getParts("Build/ultrakill.wasm.unityweb", 1, 2), 0.4, 0.4)
        ]).then(([dataUrl, wasmurl]) => {
            canvas.hidden = false;
            createUnityInstance(canvas, {
                dataUrl: dataUrl,
                frameworkUrl: "Build/ultrakill.framework.js.unityweb",
                codeUrl: wasmurl,
                streamingAssetsUrl: "StreamingAssets",
                companyName: "Hakita and Cake Logic",
                productName: "ULTRAKILL",
                productVersion: "1.4",
            }, (progress) => {
                updateProgress(0.8 + progress * 0.2);
            }).then(() => {
                const loader = document.querySelector("#loader");
                loader.style.transition = "opacity 0.8s ease, transform 0.8s ease";
                loader.style.opacity = "0";
                loader.style.transform = "translateY(-20px)";
                setTimeout(() => loader.remove(), 800);
            });
        });
    </script>
</body>
</html>
