<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Messenger</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, sans-serif;
        background: #f0f2f5;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      #chat-container {
        background: white;
        width: 100%;
        max-width: 600px;
        height: 90vh;
        display: flex;
        flex-direction: column;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        border-radius: 12px;
      }
      #header {
        padding: 15px 20px;
        background: #007bff;
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-radius: 12px 12px 0 0;
      }
      #chat-box {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .msg {
        padding: 10px 16px;
        border-radius: 18px;
        max-width: 80%;
        font-size: 15px;
        line-height: 1.4;
      }
      .user {
        align-self: flex-end;
        background: #007bff;
        color: white;
        border-bottom-right-radius: 2px;
      }
      .ai {
        align-self: flex-start;
        background: #e4e6eb;
        color: #1c1e21;
        border-bottom-left-radius: 2px;
      }
      .input-area {
        padding: 20px;
        border-top: 1px solid #eee;
        display: flex;
        gap: 10px;
      }
      input {
        flex: 1;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 25px;
        outline: none;
      }
      button {
        background: #007bff;
        color: white;
        border: none;
        padding: 0 20px;
        border-radius: 25px;
        cursor: pointer;
        font-weight: bold;
      }
      .clear-btn {
        background: rgba(255, 255, 255, 0.2);
        font-size: 12px;
        padding: 5px 10px;
        border-radius: 5px;
      }
      .clear-btn:hover {
        background: rgba(255, 255, 255, 0.3);
      }
    </style>
  </head>
  <body>
    <div id="chat-container">
      <div id="header">
        <strong>AI Assistant</strong>
        <button class="clear-btn" onclick="clearChat()">Clear Chat</button>
      </div>
      <div id="chat-box"></div>
      <div class="input-area">
        <input type="text" id="userInput" placeholder="Type your message..." autocomplete="off" />
        <button id="sendBtn" onclick="sendMessage()">Send</button>
      </div>
    </div>

    <script>
      const WORKER_URL = "https://bridge.yhooooc.workers.dev";

      const chatBox = document.getElementById("chat-box");
      const userInput = document.getElementById("userInput");

      function appendMessage(text, sender) {
        const div = document.createElement("div");
        div.className = `msg ${sender}`;
        div.innerText = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      function clearChat() {
        chatBox.innerHTML = "";
        appendMessage("Chat cleared. How can I help you?", "ai");
      }

      async function sendMessage() {
        const message = userInput.value.trim();
        if (!message) return;

        appendMessage(message, "user");
        userInput.value = "";
        userInput.disabled = true;

        try {
          const response = await fetch(WORKER_URL, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({message: message}),
          });
          const data = await response.json();
          appendMessage(data.reply || "Error: " + data.error, "ai");
        } catch (e) {
          appendMessage("Connection error. Try again.", "ai");
        } finally {
          userInput.disabled = false;
          userInput.focus();
        }
      }

      userInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") sendMessage();
      });

      window.onload = () => appendMessage("Hello! I'm your AI assistant. How can I help you today?", "ai");
    </script>
  </body>
</html>
