<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Very cool AI</title>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code&display=swap" rel="stylesheet" />

    <style>
      :root {
        --bg: #0f0f10;
        --card: #1e1f20;
        --text: #e3e3e3;
        --accent: #4285f4;
        --user-msg: #2b2c2f;
        --code-bg: #000000;
      }

      body {
        font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        display: flex;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
      }

      #chat-container {
        width: 100%;
        max-width: 850px;
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      #chat-box {
        flex: 1;
        overflow-y: auto;
        padding: 2rem 1.5rem;
        scroll-behavior: smooth;
        display: flex;
        flex-direction: column;
      }

      .msg {
        max-width: 85%;
        margin-bottom: 2rem;
        line-height: 1.6;
        font-size: 16px;
        border-radius: 12px;
        padding: 12px 16px;
        animation: fadeIn 0.3s ease-out;
        position: relative;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .user {
        align-self: flex-end;
        background: var(--user-msg);
        margin-left: auto;
        color: white;
      }

      .ai {
        align-self: flex-start;
        background: transparent;
        width: 100%;
        padding-left: 0;
      }

      .typing-dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        background: var(--accent);
        border-radius: 50%;
        margin-left: 6px;
        box-shadow: 0 0 10px var(--accent);
        vertical-align: baseline;
      }

      .ai p {
        margin: 0 0 1rem 0;
        display: inline;
      }
      .ai p:last-child {
        margin-bottom: 0;
      }

      pre {
        background: var(--code-bg) !important;
        padding: 1.2rem;
        border-radius: 10px;
        position: relative;
        overflow-x: auto;
        border: 1px solid #333;
        margin: 1rem 0;
        display: block;
      }

      code {
        font-family: "Fira Code", monospace;
        font-size: 14px;
      }

      .copy-btn {
        position: absolute;
        top: 8px;
        right: 8px;
        background: #333;
        color: #fff;
        border: none;
        padding: 5px 10px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 11px;
        transition: background 0.2s;
        z-index: 10;
      }

      .copy-btn:hover {
        background: #444;
      }

      .input-wrapper {
        padding: 1.5rem;
        background: linear-gradient(transparent, var(--bg) 20%);
      }

      .input-box {
        background: var(--card);
        border-radius: 30px;
        display: flex;
        align-items: center;
        padding: 6px 16px;
        border: 1px solid #3c4043;
        transition: border-color 0.2s;
      }

      .input-box:focus-within {
        border-color: var(--accent);
      }

      input {
        flex: 1;
        background: transparent;
        border: none;
        color: white;
        padding: 12px;
        outline: none;
        font-size: 16px;
      }

      button#sendBtn {
        background: var(--accent);
        color: white;
        border: none;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        transition: transform 0.1s;
      }

      button#sendBtn:active {
        transform: scale(0.9);
      }

      #chat-box::-webkit-scrollbar {
        width: 6px;
      }
      #chat-box::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div id="chat-container">
      <div id="chat-box"></div>
      <div class="input-wrapper">
        <div class="input-box">
          <input type="text" id="userInput" placeholder="Ask AI Architect..." autocomplete="off" />
          <button id="sendBtn" onclick="sendMessage()">↑</button>
        </div>
      </div>
    </div>

    <script>
      const GIST_URL = "https://gist.githubusercontent.com/Kingtian20/90a5be0a2b7316969ad34990fc9daf77/raw/9d8820a53162c818ba10c02ec8cc7a88b4306bae/cloud.txt";
      let WORKER_URL = "";
      let chatHistory = [
        {
          role: "system",
          content: "You are an Expert AI Architect. Provide high-quality, structured responses. Use Markdown (titles, bolding). Use code blocks with language tags. Use Tables for comparisons. Be professional and concise.",
        },
      ];

      async function plsnocrash() {
        try {
          const res = await fetch(GIST_URL);
          WORKER_URL = (await res.text()).trim();
          const introDiv = appendMessage("", "ai");
          await typeWriter(introDiv, "How can I help you today?");
        } catch (e) {
          appendMessage("Connection Error. Check Gist.", "ai");
        }
      }

      function appendMessage(text, sender) {
        const div = document.createElement("div");
        div.className = `msg ${sender}`;
        document.getElementById("chat-box").appendChild(div);
        if (sender === "user") div.innerText = text;
        document.getElementById("chat-box").scrollTop = document.getElementById("chat-box").scrollHeight;
        return div;
      }

      async function typeWriter(element, fullText) {
        let i = 0;
        const speed = 12;

        element.innerHTML = '<span class="content-holder"></span><span class="typing-dot"></span>';
        const holder = element.querySelector(".content-holder");
        const dot = element.querySelector(".typing-dot");

        return new Promise((resolve) => {
          function type() {
            if (i < fullText.length) {
              const currentChunk = fullText.substring(0, i + 1);
              holder.innerHTML = marked.parse(currentChunk);
              const textElements = holder.querySelectorAll("p, li, code");
              const lastEl = textElements.length > 0 ? textElements[textElements.length - 1] : holder;
              lastEl.appendChild(dot);

              i++;
              document.getElementById("chat-box").scrollTop = document.getElementById("chat-box").scrollHeight;
              setTimeout(type, speed);
            } else {
              dot.remove();
              holder.innerHTML = marked.parse(fullText);
              formatCode(holder);
              resolve();
            }
          }
          type();
        });
      }

      function formatCode(container) {
        container.querySelectorAll("pre").forEach((el) => {
          const btn = document.createElement("button");
          btn.className = "copy-btn";
          btn.innerText = "Copy";
          btn.onclick = () => {
            navigator.clipboard.writeText(el.querySelector("code").innerText);
            btn.innerText = "✓";
            setTimeout(() => (btn.innerText = "Copy"), 2000);
          };
          el.appendChild(btn);
          hljs.highlightElement(el.querySelector("code"));
        });
      }

      async function sendMessage() {
        const input = document.getElementById("userInput");
        const text = input.value.trim();
        if (!text || !WORKER_URL) return;

        appendMessage(text, "user");
        input.value = "";
        chatHistory.push({role: "user", content: text});

        const aiDiv = appendMessage("", "ai");
        aiDiv.innerHTML = '<span class="typing-dot"></span>';

        try {
          const res = await fetch(WORKER_URL, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({messages: chatHistory}),
          });
          const data = await res.json();
          aiDiv.innerHTML = "";
          await typeWriter(aiDiv, data.reply);
          chatHistory.push({role: "assistant", content: data.reply});
        } catch (e) {
          aiDiv.innerText = "Error reaching AI.";
        }
      }

      document.getElementById("userInput").addEventListener("keypress", (e) => e.key === "Enter" && sendMessage());
      window.onload = plsnocrash;
    </script>
  </body>
</html>
